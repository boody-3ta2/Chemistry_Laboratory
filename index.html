                for (let y = 0; y < BENCH_TOP; y += 64) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(W, y);
                    ctx.stroke();
                }
                const rg = ctx.createRadialGradient(W / 2, -60, 20, W / 2, -60, 520);
                rg.addColorStop(0, "rgba(140,230,255,.16)");
                rg.addColorStop(1, "rgba(140,230,255,0)");
                ctx.fillStyle = rg;
                ctx.fillRect(0, 0, W, BENCH_TOP + 8);
                for (const p of bgParticles) {
                    const px = (((p.x + Math.sin(t * 0.4 + p.phase) * 8) % W) + W) % W;
                    const py = (((p.y + t * p.vy * 0.4) % BENCH_TOP) + BENCH_TOP) % BENCH_TOP;
                    ctx.beginPath();
                    ctx.arc(px, py, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(140,230,255," + p.alpha + ")";
                    ctx.fill();
                }
            }
            function drawBench() {
                const g = ctx.createLinearGradient(0, BENCH_TOP, 0, BENCH_TOP + BENCH_H);
                g.addColorStop(0, "#7a5a41");
                g.addColorStop(0.09, "#5b4029");
                g.addColorStop(1, "#2a1d12");
                ctx.fillStyle = g;
                ctx.fillRect(0, BENCH_TOP, W, BENCH_H);
                ctx.fillStyle = "rgba(255,225,180,.28)";
                ctx.fillRect(0, BENCH_TOP, W, 2.5);
                const below = BENCH_TOP + BENCH_H;
                if (H > below) {
                    const g2 = ctx.createLinearGradient(0, below, 0, H);
                    g2.addColorStop(0, "#1a1208");
                    g2.addColorStop(1, "#050302");
                    ctx.fillStyle = g2;
                    ctx.fillRect(0, below, W, H - below);
                }
            }
            function flamePath(c, cx, baseY, w, h) {
                c.beginPath();
                c.moveTo(cx, baseY - h);
                c.bezierCurveTo(cx + w * 0.95, baseY - h * 0.62, cx + w, baseY - h * 0.13, cx, baseY);
                c.bezierCurveTo(cx - w, baseY - h * 0.13, cx - w * 0.95, baseY - h * 0.62, cx, baseY - h);
                c.closePath();
            }

            function drawBurner(t) {
                if (!state.showBurner) return;
                const b = state.burner;
                ctx.save();
                ctx.fillStyle = "#2b3138";
                ctx.beginPath();
                ctx.ellipse(b.x, b.base + 4, 50, 11, 0, 0, Math.PI * 2);
                ctx.fill();
                const g = ctx.createLinearGradient(b.x - 46, 0, b.x + 46, 0);
                g.addColorStop(0, "#4b535c");
                g.addColorStop(0.35, "#8b949e");
                g.addColorStop(0.6, "#5d666f");
                g.addColorStop(1, "#2f353b");
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.moveTo(b.x - 30, b.base);
                ctx.lineTo(b.x - 18, b.base - 26);
                ctx.lineTo(b.x + 18, b.base - 26);
                ctx.lineTo(b.x + 30, b.base);
                ctx.closePath();
                ctx.fill();
                const g2 = ctx.createLinearGradient(b.x - 9, 0, b.x + 9, 0);
                g2.addColorStop(0, "#6e767e");
                g2.addColorStop(0.4, "#c3cbd3");
                g2.addColorStop(1, "#565d64");
                ctx.fillStyle = g2;
                ctx.fillRect(b.x - 8, b.base - 92, 16, 68);
                ctx.fillStyle = "#3a4046";
                ctx.fillRect(b.x - 11, b.base - 96, 22, 8);
                ctx.restore();
                if (state.burnerOn) {
                    const fc = state.wire.color || null;
                    const h = b.flameH * (1 + Math.sin(t * 11) * 0.035);
                    const w = 28 * (1 + Math.sin(t * 9 + 1) * 0.05);
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    const halo = ctx.createRadialGradient(b.x, b.base - 30, 4, b.x, b.base - 30, 130);
                    halo.addColorStop(0, fc ? hexA(fc, 0.35) : "rgba(255,150,50,.32)");
                    halo.addColorStop(1, "rgba(255,120,30,0)");
                    ctx.fillStyle = halo;
                    ctx.fillRect(b.x - 140, b.base - 160, 280, 220);
                    const fg = ctx.createLinearGradient(b.x, b.base - h, b.x, b.base);
                    if (fc) {
                        fg.addColorStop(0, hexA(fc, 0.95));
                        fg.addColorStop(0.55, hexA(fc, 0.7));
                        fg.addColorStop(1, "rgba(255,255,255,.25)");
                    } else {
                        fg.addColorStop(0, "rgba(255,220,120,.9)");
                        fg.addColorStop(0.45, "rgba(255,150,40,.8)");
                        fg.addColorStop(1, "rgba(255,90,20,.35)");
                    }
                    ctx.fillStyle = fg;
                    flamePath(ctx, b.x, b.base - 78, w, h);
                    ctx.fill();
                    const ig = ctx.createLinearGradient(b.x, b.base - 78 - h * 0.5, b.x, b.base - 78);
                    ig.addColorStop(0, fc ? hexA(fc, 0.9) : "rgba(190,235,255,.95)");
                    ig.addColorStop(1, fc ? hexA(fc, 0.5) : "rgba(90,170,255,.6)");
                    ctx.fillStyle = ig;
                    flamePath(ctx, b.x, b.base - 78, w * 0.45, h * 0.5);
                    ctx.fill();
                    ctx.restore();
                } else {
                    ctx.save();
                    ctx.fillStyle = "rgba(255,193,7," + (0.6 + 0.4 * Math.sin(t * 3)) + ")";
                    ctx.font = "bold 12px Tahoma";
                    ctx.textAlign = "center";
                    ctx.fillText("اضغط للاشتعال", b.x, b.base - 110);
                    ctx.restore();
                }
            }

            function drawGasFill(v, t) {
                if (v.gasAmount <= 0) return;
                if (v.volume > 2) return;
                const gasColor = GAS_COLORS[v.gasType] || "#e8f5ff";
                const intensity = Math.min(1, v.gasAmount / 100);
                if (intensity < 0.01) return;
                const baseAlpha = 0.55 * intensity;
                ctx.save();
                vesselPath(ctx, v);
                ctx.clip();
                const fillH = (v.h - 12) * intensity;
                const top = v.y + 6 + (v.h - 12) - fillH;
                const g = ctx.createLinearGradient(v.x, top, v.x, v.y + v.h - 6);
                g.addColorStop(0, hexA(gasColor, baseAlpha * 0.55));
                g.addColorStop(0.4, hexA(gasColor, baseAlpha * 0.92));
                g.addColorStop(1, hexA(gasColor, baseAlpha * 0.75));
                ctx.fillStyle = g;
                ctx.fillRect(v.x - 3, top, v.w + 6, fillH);
                ctx.globalCompositeOperation = "lighter";
                for (let i = 0; i < 6; i++) {
                    const ph = (t * 0.55 + i * 0.17) % 1;
                    const px = v.x + 8 + ((i + 0.5) / 6) * (v.w - 16) + Math.sin(t * 1.3 + i * 2.1) * 4;
                    const py = top + ph * fillH;
                    if (py < top || py > v.y + v.h - 8) continue;
                    const rr = 6 + Math.sin(t * 1.8 + i) * 2.5;
                    const ag = ctx.createRadialGradient(px, py, 0, px, py, rr * 2.4);
                    ag.addColorStop(0, hexA(gasColor, baseAlpha * 0.65));
                    ag.addColorStop(1, hexA(gasColor, 0));
                    ctx.fillStyle = ag;
                    ctx.beginPath();
                    ctx.arc(px, py, rr * 2.4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalCompositeOperation = "source-over";
                ctx.restore();
            }

            function drawStopper(v, t) {
                if (!v.hasStopper) return;
                const op = v.opening;
                ctx.save();
                ctx.translate(op.x, op.y);
                const r = Math.max(16, v.w * 0.55);
                const hh = 12;
                const g = ctx.createLinearGradient(-r, 0, r, 0);
                g.addColorStop(0, "#3d2817");
                g.addColorStop(0.35, "#8b6b47");
                g.addColorStop(0.6, "#a07a52");
                g.addColorStop(1, "#4a3320");
                ctx.beginPath();
                ctx.ellipse(0, -hh / 2, r, hh, 0, 0, Math.PI * 2);
                ctx.fillStyle = g;
                ctx.fill();
                ctx.strokeStyle = "rgba(255,220,180,.85)";
                ctx.lineWidth = 2.4;
                ctx.stroke();
                ctx.beginPath();
                ctx.ellipse(0, -hh / 2, r * 0.7, hh * 0.65, 0, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(0,0,0,.4)";
                ctx.lineWidth = 1.4;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(-r * 0.85, -hh / 2);
                ctx.quadraticCurveTo(0, 14, r * 0.85, -hh / 2);
                ctx.strokeStyle = g;
                ctx.lineWidth = 3.4;
                ctx.stroke();
                ctx.restore();
            }

            function drawSolids(v, t) {
                const solids = v.contents.filter((c) => {
                    const it = findItem(c.id);
                    return it && it.solid === true && !c.dissolved;
                });
                if (!solids.length) return;
                const baseY = v.y + v.h - 4;
                const totalVol = solids.reduce((s, c) => s + c.vol, 0);
                const pileH = Math.min(v.h * 0.35, 8 + totalVol * 0.6);
                ctx.save();
                vesselPath(ctx, v);
                ctx.clip();
                let r = 0,
                    g = 0,
                    b = 0;
                for (const c of solids) {
                    const rgb = hexToRgb(findItem(c.id).c || "#dddddd");
                    r += rgb.r;
                    g += rgb.g;
                    b += rgb.b;
                }
                r = Math.round(r / solids.length);
                g = Math.round(g / solids.length);
                b = Math.round(b / solids.length);
                const top = baseY - pileH;
                const gg = ctx.createLinearGradient(0, top, 0, baseY);
                gg.addColorStop(0, "rgba(" + r + "," + g + "," + b + ",0.85)");
                gg.addColorStop(
                    1,
                    "rgba(" + Math.round(r * 0.7) + "," + Math.round(g * 0.7) + "," + Math.round(b * 0.7) + ",1)"
                );
                ctx.beginPath();
                ctx.moveTo(v.x - 3, baseY + 3);
                for (let i = 0; i <= 20; i++) {
                    const px = v.x - 3 + ((v.w + 6) * i) / 20;
                    const py = top + Math.sin(i * 0.9 + t * 1.4) * 1.5 + Math.sin(i * 2.1 + t * 0.8) * 1;
                    ctx.lineTo(px, py);
                }
                ctx.lineTo(v.x + v.w + 3, baseY + 3);
                ctx.closePath();
                ctx.fillStyle = gg;
                ctx.fill();
                ctx.globalCompositeOperation = "lighter";
                for (let i = 0; i < 10; i++) {
                    const px = v.x + 4 + ((i * 0.618) % 1) * (v.w - 8);
                    const py = top + 3 + ((i * 0.381) % 1) * (pileH - 6);
                    const rr = 1.2 + Math.sin(t * 2 + i) * 0.6;
                    ctx.fillStyle = "rgba(255,255,255,0.35)";
                    ctx.beginPath();
                    ctx.arc(px, py, rr, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalCompositeOperation = "source-over";
                ctx.restore();
            }

            function drawLiquid(v, t) {
                const level = Math.min(v.h - 8, (v.dispVol / v.cap) * (v.h - 10));
                if (level < 1.5) return;
                if (v.color.a <= 0.01) return;
                ctx.save();
                vesselPath(ctx, v);
                ctx.clip();
                const top = v.y + v.h - level;
                const c = v.color;
                const g = ctx.createLinearGradient(v.x, top, v.x + v.w, v.y + v.h);
                g.addColorStop(0, "rgba(" + c.r + "," + c.g + "," + c.b + "," + Math.min(1, c.a * 0.9) + ")");
                g.addColorStop(
                    0.5,
                    "rgba(" +
                        Math.round(c.r * 0.95) +
                        "," +
                        Math.round(c.g * 0.97) +
                        "," +
                        c.b +
                        "," +
                        Math.min(1, c.a) +
                        ")"
                );
                g.addColorStop(
                    1,
                    "rgba(" +
                        Math.round(c.r * 0.75) +
                        "," +
                        Math.round(c.g * 0.82) +
                        "," +
                        Math.round(c.b * 0.95) +
                        "," +
                        Math.min(1, c.a) +
                        ")"
                );
                ctx.fillStyle = g;
                ctx.fillRect(v.x - 3, top, v.w + 6, level + 3);
                ctx.fillStyle = "rgba(255,255,255,.45)";
                ctx.fillRect(v.x - 3, top, v.w + 6, 2.5);

                if (v.precipAmt > 0.02 && v.precip) {
                    const ph = v.precipAmt * Math.min(58, level * 0.88);
                    const pc = hexToRgb(v.precip.color);
                    const isWhite = pc.r > 230 && pc.g > 230 && pc.b > 230;
                    if (isWhite) {
                        ctx.save();
                        const lw = Math.min(1, v.precipAmt);
                        const tl = ctx.createLinearGradient(v.x, top, v.x, top + level);
                        tl.addColorStop(0, "rgba(250,252,255," + 0.72 * lw + ")");
                        tl.addColorStop(0.5, "rgba(242,248,255," + 0.6 * lw + ")");
                        tl.addColorStop(1, "rgba(228,238,250," + 0.55 * lw + ")");
                        ctx.fillStyle = tl;
                        ctx.fillRect(v.x - 3, top, v.w + 6, level + 3);
                        ctx.restore();
                    }
                    ctx.beginPath();
                    ctx.moveTo(v.x - 3, v.y + v.h + 3);
                    for (let i = 0; i <= 24; i++) {
                        const px = v.x - 3 + ((v.w + 6) * i) / 24;
                        const py = v.y + v.h - ph + Math.sin(i * 0.8 + t * 1.6) * 1.8 + Math.sin(i * 2.3) * 1.1;
                        ctx.lineTo(px, py);
                    }
                    ctx.lineTo(v.x + v.w + 3, v.y + v.h + 3);
                    ctx.closePath();
                    const pg = ctx.createLinearGradient(0, v.y + v.h - ph, 0, v.y + v.h);
                    if (isWhite) {
                        pg.addColorStop(0, "rgba(255,255,255,1)");
                        pg.addColorStop(0.5, "rgba(248,251,255,1)");
                        pg.addColorStop(1, "rgba(228,238,250,1)");
                    } else {
                        pg.addColorStop(0, "rgba(" + pc.r + "," + pc.g + "," + pc.b + ",1)");
                        pg.addColorStop(0.5, "rgba(" + pc.r + "," + pc.g + "," + pc.b + ",1)");
                        pg.addColorStop(
                            1,
                            "rgba(" +
                                Math.round(pc.r * 0.75) +
                                "," +
                                Math.round(pc.g * 0.75) +
                                "," +
                                Math.round(pc.b * 0.75) +
                                ",1)"
                        );
                    }
                    ctx.fillStyle = pg;
                    ctx.fill();
                    ctx.strokeStyle = isWhite
                        ? "rgba(190,210,230,.95)"
                        : "rgba(" +
                          Math.round(pc.r * 0.6) +
                          "," +
                          Math.round(pc.g * 0.6) +
                          "," +
                          Math.round(pc.b * 0.6) +
                          ",.9)";
                    ctx.lineWidth = 1.4;
                    ctx.stroke();
                    if (isWhite) {
                        ctx.save();
                        ctx.globalCompositeOperation = "lighter";
                        for (let i = 0; i < 7; i++) {
                            const px = v.x - 3 + (v.w + 6) * ((i + 0.5) / 7);
                            const py = v.y + v.h - ph * 0.5 - Math.sin(t * 1.4 + i) * 2;
                            const rr = 2.5 + Math.sin(t * 2 + i * 1.3) * 1.2;
                            const sg = ctx.createRadialGradient(px, py, 0, px, py, rr * 3);
                            sg.addColorStop(0, "rgba(255,255,255," + 0.55 * v.precipAmt + ")");
                            sg.addColorStop(1, "rgba(255,255,255,0)");
                            ctx.fillStyle = sg;
                            ctx.beginPath();
                            ctx.arc(px, py, rr * 3, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.restore();
                    }
                }
                for (const b of v.bubbles) {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255,255,255," + b.a * 0.8 + ")";
                    ctx.fill();
                    ctx.strokeStyle = "rgba(255,255,255," + b.a * 0.95 + ")";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
                if (v.brownRingProgress > 0.01) {
                    const ringH = Math.max(5, 12 * v.brownRingProgress);
                    const ringY = top + Math.max(6, level * 0.22);
                    const alpha = Math.min(0.95, v.brownRingProgress);
                    const rg = ctx.createLinearGradient(0, ringY - ringH, 0, ringY + ringH);
                    rg.addColorStop(0, "rgba(60,35,15,0)");
                    rg.addColorStop(0.35, "rgba(101,55,25," + alpha * 0.6 + ")");
                    rg.addColorStop(0.5, "rgba(75,40,15," + alpha + ")");
                    rg.addColorStop(0.65, "rgba(101,55,25," + alpha * 0.6 + ")");
                    rg.addColorStop(1, "rgba(60,35,15,0)");
                    ctx.fillStyle = rg;
                    ctx.fillRect(v.x - 3, ringY - ringH, v.w + 6, ringH * 2);
                    const rg2 = ctx.createLinearGradient(0, ringY - ringH * 0.4, 0, ringY + ringH * 0.4);
                    rg2.addColorStop(0, "rgba(50,25,8,0)");
                    rg2.addColorStop(0.5, "rgba(40,20,5," + alpha * 0.9 + ")");
                    rg2.addColorStop(1, "rgba(50,25,8,0)");
                    ctx.fillStyle = rg2;
                    ctx.fillRect(v.x - 3, ringY - ringH * 0.4, v.w + 6, ringH * 0.8);
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    const glowG = ctx.createRadialGradient(v.cx, ringY, 2, v.cx, ringY, v.w * 1.2);
                    glowG.addColorStop(0, "rgba(139,80,30," + alpha * 0.45 + ")");
                    glowG.addColorStop(1, "rgba(139,80,30,0)");
                    ctx.fillStyle = glowG;
                    ctx.fillRect(v.x - 3, ringY - ringH * 3, v.w + 6, ringH * 6);
                    ctx.restore();
                }
                ctx.restore();
            }

            function drawMysteryGlow(v, t) {
                ctx.save();
                ctx.globalCompositeOperation = "lighter";
                const pulse = 0.55 + 0.45 * Math.abs(Math.sin(t * 6));
                const hue = (t * 180) % 360;
                const hue2 = (hue + 120) % 360;
                const hue3 = (hue + 240) % 360;
                const rr = Math.max(v.w, v.h) * 2.4;
                const g1 = ctx.createRadialGradient(v.cx, v.y + v.h / 2, 5, v.cx, v.y + v.h / 2, rr);
                g1.addColorStop(0, "hsla(" + hue + ",100%,72%," + 0.85 * pulse + ")");
                g1.addColorStop(0.3, "hsla(" + hue2 + ",100%,62%," + 0.55 * pulse + ")");
                g1.addColorStop(0.6, "hsla(" + hue3 + ",100%,56%," + 0.3 * pulse + ")");
                g1.addColorStop(1, "hsla(" + hue + ",100%,50%,0)");
                ctx.fillStyle = g1;
                ctx.beginPath();
                ctx.arc(v.cx, v.y + v.h / 2, rr, 0, Math.PI * 2);
                ctx.fill();
                const rr2 = Math.max(v.w, v.h) * 3.6;
                const g2 = ctx.createRadialGradient(v.cx, v.y + v.h / 2, 10, v.cx, v.y + v.h / 2, rr2);
                g2.addColorStop(0, "hsla(" + hue3 + ",100%,65%," + 0.35 * pulse + ")");
                g2.addColorStop(1, "hsla(" + hue + ",100%,50%,0)");
                ctx.fillStyle = g2;
                ctx.beginPath();
                ctx.arc(v.cx, v.y + v.h / 2, rr2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawVessel(v, t) {
                ctx.save();
                if (v.shakeT > 0) {
                    const intensity = v.shakeT > 1.5 ? 0.4 : 0.26;
                    const a = Math.sin(v.shakeT * 38) * intensity * Math.min(v.shakeT, 2);
                    ctx.translate(v.cx, v.bottom);
                    ctx.rotate(a);
                    ctx.translate(-v.cx, -v.bottom);
                }
                if (v.thermicT > 100) {
                    drawMysteryGlow(v, t);
                }
                ctx.save();
                ctx.shadowColor = "rgba(0,0,0,.6)";
                ctx.shadowBlur = 20;
                ctx.shadowOffsetY = 8;
                ctx.fillStyle = "rgba(255,255,255,.035)";
                vesselPath(ctx, v);
                ctx.fill();
                ctx.restore();
                drawGasFill(v, t);
                drawSolids(v, t);
                drawLiquid(v, t);
                ctx.save();
                vesselPath(ctx, v);
                const gg = ctx.createLinearGradient(v.x, 0, v.x + v.w, 0);
                gg.addColorStop(0, "rgba(255,255,255,.25)");
                gg.addColorStop(0.18, "rgba(255,255,255,.04)");
                gg.addColorStop(0.82, "rgba(255,255,255,.03)");
                gg.addColorStop(1, "rgba(255,255,255,.20)");
                ctx.fillStyle = gg;
                ctx.fill();
                ctx.strokeStyle = "rgba(200,240,255,.75)";
                ctx.lineWidth = 2.4;
                ctx.stroke();
                ctx.restore();
                ctx.save();
                vesselPath(ctx, v);
                ctx.clip();
                ctx.fillStyle = "rgba(255,255,255,.25)";
                ctx.fillRect(v.x + 8, v.y + 14, 5, v.h - 44);
                ctx.restore();
                ctx.beginPath();
                ctx.ellipse(v.cx, v.y, v.w / 2, 5.5, 0, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(210,245,255,.85)";
                ctx.lineWidth = 2.2;
                ctx.stroke();
                const hasTube = tubes.some((tb) => tb.from === v || tb.to === v);
                if (v.activeGas && v.activeGas.life > 0 && !hasTube && state.running && !v.hasStopper) {
                    const gasColor = GAS_COLORS[v.activeGas.type] || "#f5f5f5";
                    const alpha = Math.min(0.6, (v.activeGas.life / 25) * 0.6);
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    for (let i = 0; i < 5; i++) {
                        const ph = (t * 0.6 + i * 0.22) % 1;
                        const px = v.cx + Math.sin(ph * 5 + i * 1.9) * 14;
                        const py = v.y - 10 - ph * 70;
                        const rr = 12 + ph * 30;
                        const ag = ctx.createRadialGradient(px, py, 0, px, py, rr);
                        ag.addColorStop(0, hexA(gasColor, alpha * (1 - ph)));
                        ag.addColorStop(1, hexA(gasColor, 0));
                        ctx.fillStyle = ag;
                        ctx.beginPath();
                        ctx.arc(px, py, rr, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
                if (v.temp > 62 && v.volume > 2 && v.activeGas && v.activeGas.life > 0) {
                    const inten = clamp((v.temp - 62) / 38, 0, 1);
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    for (let i = 0; i < 6; i++) {
                        const ph = (t * 0.9 + i * 0.37) % 1;
                        const px = v.cx + Math.sin(ph * 6 + i * 2.1) * 15;
                        const py = v.y - 6 - ph * 70;
                        const rr = 6 + ph * 22;
                        const ag = ctx.createRadialGradient(px, py, 0, px, py, rr);
                        ag.addColorStop(0, "rgba(220,245,255," + 0.16 * inten * (1 - ph) + ")");
                        ag.addColorStop(1, "rgba(220,245,255,0)");
                        ctx.fillStyle = ag;
                        ctx.beginPath();
                        ctx.arc(px, py, rr, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
                if (v.thermic && v.thermicT > 0 && v.thermicT < 100) {
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    const opacity = Math.min(1, v.thermicT / 2) * 0.4;
                    const col = v.thermic === "exo" ? "rgba(255,80,30," : "rgba(60,180,255,";
                    const glow = ctx.createRadialGradient(
                        v.cx,
                        v.y + v.h * 0.5,
                        10,
                        v.cx,
                        v.y + v.h * 0.5,
                        Math.max(v.w, v.h) * 0.9
                    );
                    glow.addColorStop(0, col + opacity + ")");
                    glow.addColorStop(1, col + "0)");
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(v.cx, v.y + v.h * 0.5, Math.max(v.w, v.h) * 0.9, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                if (v.ggFlash > 0) {
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    const gg = ctx.createRadialGradient(
                        v.cx,
                        v.y + v.h * 0.3,
                        5,
                        v.cx,
                        v.y + v.h * 0.3,
                        Math.max(v.w, v.h) * 1.3
                    );
                    gg.addColorStop(0, "rgba(255,255,255," + 0.7 * v.ggFlash + ")");
                    gg.addColorStop(0.4, "rgba(168,85,247," + 0.5 * v.ggFlash + ")");
                    gg.addColorStop(1, "rgba(168,85,247,0)");
                    ctx.fillStyle = gg;
                    ctx.beginPath();
                    ctx.arc(v.cx, v.y + v.h * 0.3, Math.max(v.w, v.h) * 1.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                if (state.gasTubeArmed && state.gasTubeSource !== v && state.gasTubeSource) {
                    ctx.save();
                    ctx.strokeStyle = "rgba(255,184,77," + (0.6 + 0.4 * Math.sin(t * 6)) + ")";
                    ctx.lineWidth = 3;
                    ctx.setLineDash([8, 6]);
                    ctx.lineDashOffset = -t * 20;
                    ctx.beginPath();
                    ctx.arc(v.cx, v.y + v.h / 2, Math.max(v.w, v.h) * 0.65, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
                if (state.gasTubeArmed && state.gasTubeSource === v) {
                    ctx.save();
                    ctx.strokeStyle = "rgba(46,204,113," + (0.75 + 0.25 * Math.sin(t * 6)) + ")";
                    ctx.lineWidth = 3.5;
                    ctx.beginPath();
                    ctx.arc(v.cx, v.y + v.h / 2, Math.max(v.w, v.h) * 0.68, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
                ctx.restore();
            }

            function drawVesselNumber(v, idx) {
                const op = v.opening;
                const x = op.x;
                const y = op.y - 22;
                const isExo = v.thermic === "exo" && v.thermicT > 0 && v.thermicT < 100;
                const isEndo = v.thermic === "endo" && v.thermicT > 0 && v.thermicT < 100;
                ctx.save();
                if (isExo || isEndo) {
                    ctx.beginPath();
                    ctx.arc(x, y, 17, 0, Math.PI * 2);
                    ctx.strokeStyle = isExo ? "rgba(255,90,40,.95)" : "rgba(60,180,255,.95)";
                    ctx.lineWidth = 3;
                    ctx.shadowColor = isExo ? "#ff5a28" : "#3cb4ff";
                    ctx.shadowBlur = 16;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
                ctx.beginPath();
                ctx.arc(x, y, 12, 0, Math.PI * 2);
                const g = ctx.createRadialGradient(x, y, 2, x, y, 12);
                g.addColorStop(0, "#a8f0ff");
                g.addColorStop(1, "#5fc8ee");
                ctx.fillStyle = g;
                ctx.shadowColor = "#7fe3ff";
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = "rgba(255,255,255,.95)";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = "#051018";
                ctx.font = "bold 13px Consolas,monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(String(idx), x, y + 1);
                if (isExo || isEndo) {
                    ctx.beginPath();
                    ctx.arc(x + 14, y - 14, 9, 0, Math.PI * 2);
                    ctx.fillStyle = isExo ? "rgba(255,90,40,.9)" : "rgba(60,180,255,.9)";
                    ctx.fill();
                    ctx.strokeStyle = "rgba(255,255,255,.9)";
                    ctx.lineWidth = 1.4;
                    ctx.stroke();
                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 11px Tahoma";
                    ctx.fillText(isExo ? "F" : "C", x + 14, y - 14);
                }
                if (v.gasAmount > 0) {
                    const barX = x - 16;
                    const barY = y + 18;
                    const barW = 32;
                    const barH = 4;
                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(barX, barY, barW, barH, 2);
                    ctx.fillStyle = "rgba(0,0,0,.55)";
                    ctx.fill();
                    const gasCol = v.gasType ? GAS_COLORS[v.gasType] || "#7fe3ff" : "#7fe3ff";
                    ctx.beginPath();
                    ctx.roundRect(barX, barY, barW * (v.gasAmount / 100), barH, 2);
                    ctx.fillStyle = gasCol;
                    ctx.shadowColor = gasCol;
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.restore();
                }
                ctx.restore();
            }

            function drawTubes(t) {
                for (const tube of tubes) {
                    const a = tube.from,
                        b = tube.to;
                    if (!vessels.includes(a) || !vessels.includes(b)) continue;
                    const oa = a.opening,
                        ob = b.opening;
                    ctx.save();
                    const cpx = (oa.x + ob.x) / 2;
                    const cpy = Math.min(oa.y, ob.y) - 70;
                    ctx.strokeStyle = "rgba(0,0,0,.55)";
                    ctx.lineWidth = 11;
                    ctx.lineCap = "round";
                    ctx.lineJoin = "round";
                    ctx.beginPath();
                    ctx.moveTo(oa.x, oa.y);
                    ctx.quadraticCurveTo(cpx, cpy, ob.x, ob.y);
                    ctx.stroke();
                    ctx.strokeStyle = "rgba(200,240,255,.85)";
                    ctx.lineWidth = 7;
                    ctx.beginPath();
                    ctx.moveTo(oa.x, oa.y);
                    ctx.quadraticCurveTo(cpx, cpy, ob.x, ob.y);
                    ctx.stroke();
                    ctx.strokeStyle = "rgba(255,255,255,.5)";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(oa.x, oa.y - 2);
                    ctx.quadraticCurveTo(cpx, cpy - 2, ob.x, ob.y - 2);
                    ctx.stroke();
                    [oa, ob].forEach((p) => {
                        ctx.strokeStyle = "rgba(255,184,77,.95)";
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                        ctx.stroke();
                    });
                    if (a.activeGas && a.activeGas.life > 0 && a.reactionStarted && state.running && !a.hasStopper) {
                        const gasColor = GAS_COLORS[a.activeGas.type] || "#f5f5f5";
                        for (let i = 0; i < 10; i++) {
                            const ph = (t * 0.5 + i / 10) % 1;
                            const px = (1 - ph) * (1 - ph) * oa.x + 2 * (1 - ph) * ph * cpx + ph * ph * ob.x;
                            const py = (1 - ph) * (1 - ph) * oa.y + 2 * (1 - ph) * ph * cpy + ph * ph * ob.y;
                            ctx.beginPath();
                            ctx.arc(px, py, 5, 0, Math.PI * 2);
                            ctx.fillStyle = hexA(gasColor, 0.95);
                            ctx.fill();
                            ctx.strokeStyle = hexA(gasColor, 1);
                            ctx.lineWidth = 1.2;
                            ctx.stroke();
                        }
                    }
                    ctx.restore();
                }
            }

            function drawPaperStrip(p, t) {
                const base = PAPERS[p.paperId];
                if (!base) return;
                ctx.save();
                const bob = Math.sin(t * 1.6 + p.animT) * 0.5;
                let scale = 1;
                if (p.isMystery && p.spawnScale !== undefined && p.spawnScale < 1) {
                    const elapsed = performance.now() - (p.spawnTime || 0);
                    p.spawnScale = Math.min(1, elapsed / 600);
                    scale = 1 + Math.sin(p.spawnScale * Math.PI) * 0.5;
                    scale *= p.spawnScale;
                }
                ctx.translate(p.x + p.w / 2, p.y + p.h / 2 + bob);
                ctx.rotate(p.angle);
                if (scale !== 1) ctx.scale(scale, scale);
                if (p.isRod && !p.burning) {
                    const rodW = 10;
                    const rodH = 64;
                    ctx.save();
                    ctx.shadowColor = "rgba(0,0,0,.55)";
                    ctx.shadowBlur = 12;
                    ctx.shadowOffsetY = 5;
                    const rg = ctx.createLinearGradient(-rodW / 2, 0, rodW / 2, 0);
                    rg.addColorStop(0, "#c8c8c8");
                    rg.addColorStop(0.35, "#f0f0f0");
                    rg.addColorStop(0.65, "#e0e0e0");
                    rg.addColorStop(1, "#b0b0b0");
                    ctx.beginPath();
                    ctx.roundRect(-rodW / 2, -rodH / 2, rodW, rodH, rodW / 2);
                    ctx.fillStyle = rg;
                    ctx.fill();
                    ctx.restore();
                    ctx.strokeStyle = "rgba(80,80,80,.7)";
                    ctx.lineWidth = 1.3;
                    ctx.beginPath();
                    ctx.roundRect(-rodW / 2, -rodH / 2, rodW, rodH, rodW / 2);
                    ctx.stroke();
                    const tipColor = base.color;
                    const tipGrad = ctx.createRadialGradient(0, -rodH / 2, 1, 0, -rodH / 2, 12);
                    tipGrad.addColorStop(0, hexA(tipColor, 0.95));
                    tipGrad.addColorStop(1, hexA(tipColor, 0.15));
                    ctx.beginPath();
                    ctx.arc(0, -rodH / 2, 11, 0, Math.PI * 2);
                    ctx.fillStyle = tipGrad;
                    ctx.fill();
                    if (p.reacted) {
                        ctx.beginPath();
                        ctx.arc(0, -rodH / 2, 14, 0, Math.PI * 2);
                        ctx.strokeStyle = "rgba(255,214,107,.95)";
                        ctx.lineWidth = 2.4;
                        ctx.shadowColor = "#ffd66b";
                        ctx.shadowBlur = 14;
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                    ctx.restore();
                    return;
                }
                let drawColor = p.color;
                if (p.isMystery && !p.burning) {
                    const hue = (t * 60) % 360;
                    drawColor = "hsl(" + hue + ",80%,60%)";
                }
                if (p.burning) {
                    drawColor = lerpColor(drawColor, "#1a1a1a", p.burnProgress);
                }
                ctx.save();
                ctx.shadowColor = p.isMystery ? "rgba(168,85,247,.7)" : "rgba(0,0,0,.55)";
                ctx.shadowBlur = p.isMystery ? 20 : 14;
                ctx.shadowOffsetY = 6;
                ctx.beginPath();
                ctx.roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 5);
                const pg = ctx.createLinearGradient(0, -p.h / 2, 0, p.h / 2);
                pg.addColorStop(0, drawColor);
                pg.addColorStop(1, lerpColor(drawColor, "#000000", 0.22));
                ctx.fillStyle = pg;
                ctx.fill();
                ctx.restore();
                ctx.strokeStyle = p.isMystery ? "rgba(168,85,247,.95)" : "rgba(0,0,0,.4)";
                ctx.lineWidth = p.isMystery ? 2.5 : 1.3;
                ctx.beginPath();
                ctx.roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 5);
                ctx.stroke();
                if (p.isMystery && !p.burning) {
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    for (let i = 0; i < 5; i++) {
                        const ph = (t * 1.5 + i * 0.25) % 1;
                        const px = Math.sin(ph * 6 + i * 1.8) * p.w * 0.35;
                        const py = Math.cos(ph * 6 + i * 1.8) * p.h * 0.35;
                        const rr = 8 + Math.sin(t * 3 + i) * 3;
                        const ag = ctx.createRadialGradient(px, py, 0, px, py, rr * 2);
                        ag.addColorStop(0, "rgba(196,107,255,0.55)");
                        ag.addColorStop(1, "rgba(196,107,255,0)");
                        ctx.fillStyle = ag;
                        ctx.beginPath();
                        ctx.arc(px, py, rr * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    if (p.gasFlash > 0) {
                        const intensity = p.gasFlash;
                        const flashPulse = 0.55 + 0.45 * Math.abs(Math.sin(t * 8));
                        ctx.globalCompositeOperation = "lighter";
                        const halo = ctx.createRadialGradient(0, 0, 5, 0, 0, p.w * 1.8);
                        halo.addColorStop(0, "rgba(255,255,255," + 0.9 * intensity * flashPulse + ")");
                        halo.addColorStop(0.35, "rgba(236,72,153," + 0.7 * intensity * flashPulse + ")");
                        halo.addColorStop(0.7, "rgba(168,85,247," + 0.45 * intensity * flashPulse + ")");
                        halo.addColorStop(1, "rgba(168,85,247,0)");
                        ctx.fillStyle = halo;
                        ctx.beginPath();
                        ctx.arc(0, 0, p.w * 1.8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "rgba(255,255,255," + 0.55 * intensity * flashPulse + ")";
                        ctx.beginPath();
                        ctx.roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 5);
                        ctx.fill();
                        for (let i = 0; i < 4; i++) {
                            const ph = (t * 2 + i * 0.25) % 1;
                            const px = Math.sin(ph * 8 + i * 2.1) * p.w * 0.6;
                            const py = Math.cos(ph * 8 + i * 2.1) * p.h * 0.6;
                            const rr = 5 + Math.sin(t * 4 + i) * 2;
                            const sg = ctx.createRadialGradient(px, py, 0, px, py, rr * 2.5);
                            sg.addColorStop(0, "rgba(255,255,255," + 0.85 * intensity + ")");
                            sg.addColorStop(1, "rgba(255,255,255,0)");
                            ctx.fillStyle = sg;
                            ctx.beginPath();
                            ctx.arc(px, py, rr * 2.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    ctx.restore();
                }
                if (p.burning) {
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    for (let i = 0; i < 6; i++) {
                        const ph = (t * 3 + i * 0.3) % 1;
                        const px = (Math.random() - 0.5) * p.w;
                        const py = p.h / 2 - ph * p.h;
                        const rr = 6 + Math.random() * 10;
                        const ag = ctx.createRadialGradient(px, py, 0, px, py, rr);
                        ag.addColorStop(0, "rgba(255,220,100," + (1 - ph) * 0.9 + ")");
                        ag.addColorStop(0.5, "rgba(255,120,30," + (1 - ph) * 0.6 + ")");
                        ag.addColorStop(1, "rgba(255,60,0,0)");
                        ctx.fillStyle = ag;
                        ctx.beginPath();
                        ctx.arc(px, py, rr, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
                if (p.reacted && !p.burning && !p.isMystery) {
                    ctx.save();
                    ctx.strokeStyle = "rgba(255,214,107,.95)";
                    ctx.lineWidth = 2.4;
                    ctx.shadowColor = "#ffd66b";
                    ctx.shadowBlur = 14;
                    ctx.beginPath();
                    ctx.roundRect(-p.w / 2 - 3, -p.h / 2 - 3, p.w + 6, p.h + 6, 6);
                    ctx.stroke();
                    ctx.restore();
                }
                ctx.restore();
            }

            function drawThermometer() {
                if (!state.showThermo) return;
                const x = W - 95,
                    top = 165,
                    bot = 415;
                let maxT = 25;
                for (const v of vessels) if (v.volume > 0) maxT = Math.max(maxT, v.temp);
                const frac = clamp(maxT / 120, 0, 1);
                ctx.save();
                ctx.beginPath();
                ctx.roundRect(x - 9, top, 18, bot - top, 9);
                ctx.fillStyle = "rgba(230,250,255,.14)";
                ctx.fill();
                ctx.strokeStyle = "rgba(190,235,255,.55)";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(x, bot + 14, 14, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(230,250,255,.16)";
                ctx.fill();
                ctx.strokeStyle = "rgba(190,235,255,.55)";
                ctx.stroke();
                const mh = frac * (bot - top - 14);
                const mg = ctx.createLinearGradient(0, bot + 14, 0, top);
                mg.addColorStop(0, "#ff4d4d");
                mg.addColorStop(0.5, "#ff7043");
                mg.addColorStop(1, "#ffca28");
                ctx.fillStyle = mg;
                ctx.beginPath();
                ctx.roundRect(x - 5, bot - mh, 10, mh + 6, 5);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x, bot + 14, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#9fe9ff";
                ctx.font = "bold 10px Tahoma";
                ctx.textAlign = "center";
                ctx.fillText("C", x, top - 10);
                ctx.restore();
            }

            function drawWire() {
                if (!state.showBurner || !state.wire.active) return;
                const b = state.burner;
                const x = b.x,
                    y = b.base - 96 - 40;
                ctx.save();
                ctx.strokeStyle = "#d8dee4";
                ctx.lineWidth = 2.4;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(x + 95, y - 70);
                ctx.quadraticCurveTo(x + 50, y - 58, x + 2, y - 6);
                ctx.stroke();
                ctx.fillStyle = "#37474f";
                ctx.beginPath();
                ctx.roundRect(x + 88, y - 84, 16, 34, 5);
                ctx.fill();
                const c = state.wire.loaded
                    ? FLAME_TEST[state.wire.loaded]
                        ? FLAME_TEST[state.wire.loaded].color
                        : "#ffffff"
                    : "#e0e0e0";
                ctx.beginPath();
                ctx.arc(x + 2, y - 5, 4.5, 0, Math.PI * 2);
                ctx.fillStyle = c;
                ctx.fill();
                ctx.shadowColor = c;
                ctx.shadowBlur = 14;
                ctx.fill();
                ctx.restore();
            }

            function drawDroplets(dt) {
                for (const d of droplets) {
                    if (d.dead) continue;
                    d.vy += 620 * dt;
                    d.y += d.vy * dt;
                    if (d.y >= d.target) {
                        d.dead = true;
                        continue;
                    }
                    ctx.beginPath();
                    ctx.ellipse(d.x, d.y, d.r * 0.85, d.r * 1.5, 0, 0, Math.PI * 2);
                    ctx.fillStyle = hexA(d.color, d.alpha);
                    ctx.fill();
                }
                droplets = droplets.filter((d) => !d.dead);
            }
            function drawPourDrips(dt) {
                for (const d of pourDrips) {
                    if (d.dead) continue;
                    d.vy += 700 * dt;
                    d.y += d.vy * dt;
                    d.x += d.vx * dt;
                    if (d.y > d.target) {
                        d.dead = true;
                        continue;
                    }
                    ctx.beginPath();
                    ctx.ellipse(d.x, d.y, d.r * 0.85, d.r * 1.5, 0, 0, Math.PI * 2);
                    ctx.fillStyle = d.color;
                    ctx.fill();
                }
                pourDrips = pourDrips.filter((d) => !d.dead);
            }
            function drawSmokeClouds(dt) {
                for (const s of smokeClouds) {
                    s.life -= dt;
                    if (s.life <= 0) continue;
                    const alpha = s.life / s.maxLife;
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    const t = performance.now() / 1000;
                    const rBase = s.r || 40;
                    for (let i = 0; i < 10; i++) {
                        const ph = (t * 0.4 + i * 0.15) % 1;
                        const px = s.x + Math.sin(ph * 4 + i * 1.5) * rBase * 0.7;
                        const py = s.y - ph * rBase * 1.3;
                        const rr = rBase * 0.35 + ph * rBase * 0.8;
                        const ag = ctx.createRadialGradient(px, py, 0, px, py, rr);
                        ag.addColorStop(0, "rgba(255,255,255," + alpha * 0.55 * (1 - ph) + ")");
                        ag.addColorStop(1, "rgba(255,255,255,0)");
                        ctx.fillStyle = ag;
                        ctx.beginPath();
                        ctx.arc(px, py, rr, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
                smokeClouds = smokeClouds.filter((s) => s.life > 0);
            }
            function drawSparks(dt) {
                for (const s of sparks) {
                    s.life -= dt;
                    if (s.life <= 0) continue;
                    s.vy += 180 * dt;
                    s.x += s.vx * dt;
                    s.y += s.vy * dt;
                    const alpha = s.life / s.maxLife;
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r * alpha, 0, Math.PI * 2);
                    ctx.fillStyle = hexA(s.color, alpha);
                    ctx.fill();
                    ctx.restore();
                }
                sparks = sparks.filter((s) => s.life > 0);
            }

            function updatePaperReaction(p, dt) {
                if (p.dead) return;
                if (p.gasFlash > 0 && !p.gasPassed) {
                    p.gasFlash = Math.max(0, p.gasFlash - dt * 1.8);
                }
                if (p.burning) {
                    p.burnProgress = Math.min(1, p.burnProgress + dt * 0.8);
                    if (Math.random() < dt * 15) spawnSparks(p.x + p.w / 2, p.y + p.h / 2, 2);
                    if (p.burnProgress >= 1) {
                        p.burning = false;
                        p.burnt = true;
                        p.dead = true;
                        if (p.isMystery && p.gasPassed && !p.easterShown) {
                            p.easterShown = true;
                            showEasterEgg();
                        }
                    }
                    return;
                }
                if (p.isRod) {
                    let matched = null,
                        targetVessel = null;
                    for (const v of vessels) {
                        if (!state.running) continue;
                        if (v.hasStopper) continue;
                        if (v.contents.length === 0) continue;
                        const dx = p.x + p.w / 2 - v.cx;
                        const dy = p.y + p.h / 2 - v.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > 120) continue;
                        const rodReactions = ROD_REACTIONS[p.paperId];
                        if (!rodReactions) continue;
                        for (const c of v.contents) {
                            if (rodReactions[c.id]) {
                                matched = rodReactions[c.id];
                                targetVessel = v;
                                break;
                            }
                        }
                        if (matched) break;
                    }
                    if (matched && targetVessel) {
                        p.reacted = true;
                        if (matched.smoke) {
                            const smokeR = Math.max(targetVessel.w, 60) * 1.2 + 20;
                            smokeClouds.push({
                                x: targetVessel.cx,
                                y: targetVessel.y - 30,
                                life: 0.7,
                                maxLife: 0.7,
                                r: smokeR,
                            });
                        }
                        if (matched.thermic) {
                            targetVessel.thermic = matched.thermic;
                            targetVessel.thermicT = 6;
                        }
                        const reactionKey = p.paperId + "_" + targetVessel.id;
                        if (p.currentReactionKey !== reactionKey) {
                            p.currentReactionKey = reactionKey;
                            setVesselEquation(targetVessel, matched.eq, matched.note);
                            addLog(
                                "🧪 " +
                                    PAPERS[p.paperId].ar +
                                    " + " +
                                    targetVessel.contents.map((c) => findItem(c.id).label || c.id).join(", ") +
                                    ": " +
                                    matched.note
                            );
                            playDing();
                        }
                        if (Math.random() < 0.04) playFizz(0.25);
                    } else {
                        p.currentReactionKey = null;
                        p.reacted = false;
                    }
                    return;
                }
                if (p.isMystery) {
                    let nearest = null,
                        minDist = 150;
                    for (const v of vessels) {
                        if (!v.activeGas || v.activeGas.life <= 0) continue;
                        if (!state.running) continue;
                        if (v.hasStopper) continue;
                        if (v.activeGas.type !== "CO2") continue;
                        const dx = p.x + p.w / 2 - v.cx,
                            dy = p.y + p.h / 2 - v.y;
                        const d = Math.sqrt(dx * dx + dy * dy);
                        if (d < minDist) {
                            minDist = d;
                            nearest = v;
                        }
                    }
                    if (nearest) {
                        p.gasPassed = true;
                        p.gasFlash = 1;
                    }
                    if (state.showBurner && state.burnerOn) {
                        const b = state.burner;
                        const dx = p.x + p.w / 2 - b.x;
                        const dy = p.y + p.h / 2 - (b.base - 78);
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 115) {
                            p.burning = true;
                            p.burnProgress = 0.05;
                            playFizz(1.5);
                            spawnSparks(p.x + p.w / 2, p.y + p.h / 2, 15);
                        }
                    }
                    return;
                }
                if (state.showBurner && state.burnerOn) {
                    const b = state.burner;
                    const dx = p.x + p.w / 2 - b.x;
                    const dy = p.y + p.h / 2 - (b.base - 78);
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 115) {
                        p.burning = true;
                        p.burnProgress = 0.05;
                        addLog("🔥 الورقة اقتربت من اللهب — بدأت تحترق");
                        setVesselEquation(
                            { id: "burn_" + p.paperId },
                            "ورقة " + PAPERS[p.paperId].label + "(s) + O2(g) --احتراق--> CO2(g) + H2O(g) + رماد",
                            "احتراق كامل — اختفت الورقة"
                        );
                        playFizz(1.5);
                        spawnSparks(p.x + p.w / 2, p.y + p.h / 2, 15);
                    }
                }
                let nearest = null,
                    minDist = 130;
                for (const v of vessels) {
                    if (!v.activeGas || v.activeGas.life <= 0) continue;
                    if (!state.running) continue;
                    if (v.hasStopper) continue;
                    const dx = p.x + p.w / 2 - v.cx,
                        dy = p.y + p.h / 2 - v.y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < minDist) {
                        minDist = d;
                        nearest = v;
                    }
                }
                if (!nearest) {
                    p.contactGas = null;
                    return;
                }
                const gasType = nearest.activeGas.type;
                const test = (GAS_TESTS[gasType] || {})[p.paperId];
                if (!test) return;
                p.contactGas = gasType;
                if (p.reacted) {
                    if (p.color !== test.color) p.color = test.color;
                    return;
                }
                p.progress = Math.min(1, p.progress + dt / 2.4);
                p.color = lerpColor(PAPERS[p.paperId].color, test.color, p.progress);
                if (p.progress >= 1) {
                    p.reacted = true;
                    addLog("📜 " + PAPERS[p.paperId].ar + " + " + gasType + ": " + test.note);
                    setVesselEquation(
                        nearest,
                        test.eq || gasType + " + " + PAPERS[p.paperId].label + " -> تغيّر لوني",
                        test.note
                    );
                    playDing();
                    playFizz(0.8);
                }
            }

            function formatSingleLine(line) {
                let s = line;
                s = s
                    .replace(/--Δ-->/g, "\u2401")
                    .replace(/--ضوء-->/g, "\u2402")
                    .replace(/--احتراق-->/g, "\u2403")
                    .replace(/--اهتزاز-->/g, "\u2407")
                    .replace(/-->/g, "\u2404")
                    .replace(/→/g, "\u2405")
                    .replace(/⇌/g, "\u2406");
                s = s
                    .replace(/₀/g, "\uE000")
                    .replace(/₁/g, "\uE001")
                    .replace(/₂/g, "\uE002")
                    .replace(/₃/g, "\uE003")
                    .replace(/₄/g, "\uE004")
                    .replace(/₅/g, "\uE005")
                    .replace(/₆/g, "\uE006")
                    .replace(/₇/g, "\uE007")
                    .replace(/₈/g, "\uE008")
                    .replace(/₉/g, "\uE009");
                s = s
                    .replace(/⁰/g, "\uE010")
                    .replace(/¹/g, "\uE011")
                    .replace(/²/g, "\uE012")
                    .replace(/³/g, "\uE013")
                    .replace(/⁴/g, "\uE014")
                    .replace(/⁵/g, "\uE015")
                    .replace(/⁶/g, "\uE016")
                    .replace(/⁷/g, "\uE017")
                    .replace(/⁸/g, "\uE018")
                    .replace(/⁹/g, "\uE019");
                s = s.replace(/⁺/g, "\uE01A").replace(/⁻/g, "\uE01B");
                s = s.replace(/—/g, "\uE020").replace(/–/g, "\uE021").replace(/×/g, "\uE022").replace(/·/g, "\uE023");
                let html = s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                html = html
                    .replace(/\u2401/g, '<span class="heat">--Δ--&gt;</span>')
                    .replace(/\u2402/g, '<span class="light">--ضوء--&gt;</span>')
                    .replace(/\u2403/g, '<span class="burn">--احتراق--&gt;</span>')
                    .replace(/\u2407/g, '<span class="eq">--اهتزاز--&gt;</span>')
                    .replace(/\u2404/g, '<span class="ar">--&gt;</span>')
                    .replace(/\u2405/g, '<span class="ar">→</span>')
                    .replace(/\u2406/g, '<span class="eq">⇌</span>');
                html = html
                    .replace(/\uE000/g, "<sub>0</sub>")
                    .replace(/\uE001/g, "<sub>1</sub>")
                    .replace(/\uE002/g, "<sub>2</sub>")
                    .replace(/\uE003/g, "<sub>3</sub>")
                    .replace(/\uE004/g, "<sub>4</sub>")
                    .replace(/\uE005/g, "<sub>5</sub>")
                    .replace(/\uE006/g, "<sub>6</sub>")
                    .replace(/\uE007/g, "<sub>7</sub>")
                    .replace(/\uE008/g, "<sub>8</sub>")
                    .replace(/\uE009/g, "<sub>9</sub>");
                html = html
                    .replace(/\uE010/g, "<sup>0</sup>")
                    .replace(/\uE011/g, "<sup>1</sup>")
                    .replace(/\uE012/g, "<sup>2</sup>")
                    .replace(/\uE013/g, "<sup>3</sup>")
                    .replace(/\uE014/g, "<sup>4</sup>")
                    .replace(/\uE015/g, "<sup>5</sup>")
                    .replace(/\uE016/g, "<sup>6</sup>")
                    .replace(/\uE017/g, "<sup>7</sup>")
                    .replace(/\uE018/g, "<sup>8</sup>")
                    .replace(/\uE019/g, "<sup>9</sup>");
                html = html.replace(/\uE01A/g, "<sup>+</sup>").replace(/\uE01B/g, "<sup>-</sup>");
                html = html
                    .replace(/\uE020/g, "-")
                    .replace(/\uE021/g, "-")
                    .replace(/\uE022/g, "x")
                    .replace(/\uE023/g, ".");
                html = html.replace(/\((s|l|g|aq)\)/g, "<sub>($1)</sub>");
                html = html.replace(/↑/g, '<span class="g">↑</span>').replace(/↓/g, '<span class="p">↓</span>');
                return html;
            }
            function formatEquationHTML(eq) {
                return String(eq).split("\n").map(formatSingleLine).join("<br>");
            }

            let lastEqHash = "";

            function renderEquations(force) {
                const active = vessels
                    .map(function (v, i) {
                        return { v: v, i: i };
                    })
                    .filter(function (x) {
                        return x.v.contents.length > 0;
                    });
                const newHash =
                    active.map((x) => x.v.id + "|" + (x.v.lastEq || "") + "|" + (x.v.lastNote || "")).join("§") +
                    "||" +
                    (state.equation ? state.equation.eq : "") +
                    "||" +
                    active.length;
                if (!force && newHash === lastEqHash) return;
                lastEqHash = newHash;
                const eqbar = document.getElementById("eqbar");
                const oldList = eqbar.querySelector(".eq-list");
                const oldListScroll = oldList ? oldList.scrollTop : 0;
                const oldLine = eqbar.querySelector(".eq-line");
                const oldLineScroll = oldLine ? oldLine.scrollTop : 0;
                const oldContent = eqbar.querySelectorAll(".eq-line,.eq-list");
                oldContent.forEach((l) => l.remove());
                const noteEl = document.getElementById("eqnote");
                if (!active.length) {
                    const div = document.createElement("div");
                    div.className = "eq-line";
                    if (state.equation) {
                        div.innerHTML = formatEquationHTML(state.equation.eq);
                        noteEl.textContent = state.equation.note || "";
                    } else {
                        div.textContent = "— المعادلة ستظهر هنا —";
                        noteEl.textContent = "";
                    }
                    eqbar.insertBefore(div, noteEl);
                    return;
                }
                if (active.length === 1) {
                    const x = active[0];
                    const div = document.createElement("div");
                    div.className = "eq-line";
                    if (x.v.lastEq) {
                        div.innerHTML = formatEquationHTML(x.v.lastEq);
                    } else {
                        div.textContent = "— بانتظار التفاعل —";
                    }
                    eqbar.insertBefore(div, noteEl);
                    noteEl.textContent = x.v.lastNote || "";
                    if (oldLineScroll > 0) div.scrollTop = oldLineScroll;
                    return;
                }
                const wrap = document.createElement("div");
                wrap.className = "eq-list";
                for (const x of active) {
                    const idx = x.i + 1;
                    const item = document.createElement("div");
                    item.className = "eq-list-item";
                    const num = document.createElement("span");
                    num.className = "eq-num";
                    num.textContent = idx;
                    const eq = document.createElement("span");
                    eq.className = "eq-line-inline";
                    if (x.v.lastEq) {
                        eq.innerHTML = formatEquationHTML(x.v.lastEq);
                    } else {
                        eq.textContent = "— بانتظار التفاعل —";
                        eq.style.color = "#6a8fa3";
                        eq.style.fontStyle = "italic";
                    }
                    item.appendChild(num);
                    item.appendChild(eq);
                    wrap.appendChild(item);
                }
                eqbar.insertBefore(wrap, noteEl);
                noteEl.textContent = "";
                if (oldListScroll > 0) wrap.scrollTop = oldListScroll;
            }

            function setVesselEquation(v, eq, note) {
                state.equation = { eq, note: note || "" };
                if (v && vessels.indexOf(v) >= 0) {
                    v.lastEq = eq;
                    v.lastNote = note || "";
                }
                addToHistory(eq, note);
                renderEquations(true);
            }
            function addToHistory(eq, note) {
                reactionHistory.unshift({ eq, note: note || "" });
                if (reactionHistory.length > 30) reactionHistory.pop();
                renderHistory();
            }
            function renderHistory() {
                const el = document.getElementById("historyList");
                if (!el) return;
                if (!reactionHistory.length) {
                    el.innerHTML = '<div class="history-empty">لا توجد تفاعلات بعد</div>';
                    return;
                }
                let html = "";
                for (const r of reactionHistory) {
                    html += '<div class="history-item">';
                    html += '<div class="hi-eq">' + formatEquationHTML(r.eq) + "</div>";
                    if (r.note) html += '<div class="hi-note">' + r.note + "</div>";
                    html += "</div>";
                }
                el.innerHTML = html;
            }

            function triggerGasGasReaction(a, b, rx) {
                const g1 = a.activeGas ? a.activeGas.type : "";
                const g2 = b && b.activeGas ? b.activeGas.type : "";
                if (!g1 || !g2) return;
                const x = b ? (a.cx + b.cx) / 2 : a.cx;
                const topY = b ? Math.min(a.y, b.y) - 28 : a.y - 28;
                const smokeR = Math.max(a.w, b ? b.w : 0) * 1.1 + 18;
                if (rx.smoke) {
                    smokeClouds.push({ x: x, y: topY, life: 1.4, maxLife: 1.4, r: smokeR });
                    smokeClouds.push({ x: x - smokeR * 0.35, y: topY + 12, life: 1.3, maxLife: 1.3, r: smokeR * 0.85 });
                    smokeClouds.push({ x: x + smokeR * 0.35, y: topY + 12, life: 1.3, maxLife: 1.3, r: smokeR * 0.85 });
                }
                const liquidTarget = a.contents.length > 0 ? a : b && b.contents.length > 0 ? b : null;
                if (rx.precip && liquidTarget) {
                    liquidTarget.precip = Object.assign({}, rx.precip);
                    liquidTarget.precipTarget = 1;
                    liquidTarget.precipAmt = Math.max(liquidTarget.precipAmt, 0.25);
                }
                if (rx.tint && liquidTarget) {
                    liquidTarget.colorTarget = Object.assign({}, hexToRgb(rx.tint), {
                        a: rx.tint === "#f5f5f5" ? 0.22 : 1,
                    });
                }
                a.ggFlash = 1;
                if (b) {
                    b.ggFlash = 1;
                }
                const note = rx.note + " (" + g1 + " + " + g2 + ")";
                reactionHistory.unshift({ eq: rx.eq, note: note });
                if (reactionHistory.length > 30) reactionHistory.pop();
                renderHistory();
                addLog("💨 تفاعل غاز-غاز [" + g1 + " + " + g2 + "]: " + rx.note);
                if (rx.precip && rx.precip.ar) {
                    addLog("🧪 راسب " + rx.precip.formula + " (" + rx.precip.ar + ") من تفاعل " + g1 + " + " + g2);
                }
                playFizz(2);
                playDing();
            }
            function showEasterEgg() {

                    document.head.appendChild(st);
                }
                const labelEl = document.getElementById("devLabel");
                const nameEl = document.getElementById("devName");
                if (!labelEl || !nameEl) return;
                labelEl.textContent = "";
                nameEl.textContent = "";
                overlay.classList.add("show");
                const labelTxt = "DEVELOPED-BY";
                const nameTxt = " boody_3ta";
                let i = 0;
                const t1 = setInterval(function () {
                    labelEl.textContent = labelTxt.slice(0, ++i);
                    if (i >= labelTxt.length) {
                        clearInterval(t1);
                        let j = 0;
                        const t2 = setInterval(function () {
                            nameEl.textContent = nameTxt.slice(0, ++j);
                            if (j >= nameTxt.length) {
                                clearInterval(t2);

                                    overlay.classList.remove("show");

                }, 70);
                playDing();
                setTimeout(playDing, 400);
