            function ionHTML(str) {
                let html = "";
                let i = 0;
                while (i < str.length) {
                    const ch = str[i];
                    if (SUB_DIGITS[ch]) {
                        let buf = "";
                        while (i < str.length && SUB_DIGITS[str[i]]) {
                            buf += SUB_DIGITS[str[i]];
                            i++;
                        }
                        html += "<sub>" + buf + "</sub>";
                    } else if (SUP_CHARS[ch]) {
                        let buf = "";
                        while (i < str.length && SUP_CHARS[str[i]]) {
                            buf += SUP_CHARS[str[i]];
                            i++;
                        }
                        if (buf.indexOf("-") > 0 && buf.charAt(0) !== "-") buf = "-" + buf.replace("-", "");
                        if (buf.indexOf("+") > 0 && buf.charAt(0) !== "+") buf = "+" + buf.replace("+", "");
                        html += "<sup>" + buf + "</sup>";
                    } else {
                        html += ch;
                        i++;
                    }
                }
                return html;
            }

            function smartReact(contents) {
                const vesselIds = contents.map((c) => c.id);
                const solidIds = new Set();
                for (const c of contents) {
                    if (!c.dissolved && c.solid) solidIds.add(c.id);
                }
                const ions = { cat: [], an: [] };
                for (const c of contents) {
                    const item = findItem(c.id);
                    if (item && item.solid === true && !c.dissolved) continue;
                    const map = ID_IONS[c.id];
                    if (map) {
                        ions.cat.push(...map.cat.map((x) => ({ ion: x, from: c.id })));
                        ions.an.push(...map.an.map((x) => ({ ion: x, from: c.id })));
                    }
                }
                const reactions = [];
                const seen = new Set();
                const presentIds = vesselIds.slice();

                for (let i = 0; i < presentIds.length; i++) {
                    for (let j = i + 1; j < presentIds.length; j++) {
                        const a = presentIds[i],
                            b = presentIds[j];
                        const k1 = a + "|" + b,
                            k2 = b + "|" + a;
                        const sp = SPECIAL_PAIR_REACTIONS[k1] || SPECIAL_PAIR_REACTIONS[k2];
                        if (!sp || sp.skip) continue;
                        let requiredSolid = null;
                        if (a === "h2so4c" && SOLID_REQUIRED_IDS.has(b)) requiredSolid = b;
                        else if (b === "h2so4c" && SOLID_REQUIRED_IDS.has(a)) requiredSolid = a;
                        if (requiredSolid && !solidIds.has(requiredSolid)) continue;
                        const spKey = k1 < k2 ? k1 : k2;
                        if (seen.has("SP|" + spKey)) continue;
                        seen.add("SP|" + spKey);
                        const rxn = {
                            gas: sp.gas || null,
                            tint: sp.tint || null,
                            heat: sp.heat || null,
                            precip: sp.precip
                                ? {
                                      formula: sp.precip.formula,
                                      color: sp.precip.color,
                                      ar: sp.precip.ar,
                                      arColor: sp.precip.arColor || colorName(sp.precip.color),
                                      light: sp.precip.light,
                                      onHeat: sp.precip.onHeat,
                                      onStand: sp.precip.onStand,
                                      oxidize: sp.precip.oxidize,

                                : null,
                            eq: sp.eq,
                            note: sp.note,
                            identifiedFrom: a,
                            thermic: sp.thermic || "exo",

                        if (requiredSolid) rxn.consumedSolids = [requiredSolid];
                        reactions.push(rxn);
                    }
                }

                const strongAcidIds = ["hcl", "h2so4c", "hno3"];
                const presentAcids = strongAcidIds.filter((a) => vesselIds.includes(a));

                if (presentAcids.length) {
                    for (const presentAcid of presentAcids) {
                        for (const srcId of vesselIds) {
                            const srcInfo = ID_IONS[srcId];
                            if (!srcInfo) continue;
                            if (!solidIds.has(srcId)) continue;
                            for (const anion of srcInfo.an) {
                                const key = presentAcid + "+" + anion;
                                if (seen.has(key)) continue;
                                const eqKey = srcId + "|" + presentAcid;
                                const eqText = ACID_EQ_MAP[eqKey];
                                if (!eqText) continue;
                                const gasFromAnion = {
                                    "CO3^2-": "CO2",
                                    "HCO3^-": "CO2",
                                    "SO3^2-": "SO2",
                                    "S^2-": "H2S",
                                    "S2O3^2-": "SO2",
                                    "NO2^-": "NO",
                                    "C2O4^2-": "CO2",

                                seen.add(key);
                                const note =

                                        H2S: "تصاعد H2S — رائحة عفن البيض",
                                        NO: "تصاعد NO — يتأكسد في الهواء إلى NO2 بني محمر",
                                        HF: "تصاعد HF — حمض الهيدروفلوريك",
                                    }[gasFromAnion] || "تصاعد غاز";

                                    anion === "S2O3^2-"
                                        ? { formula: "S", color: "#f5d020", ar: "كبريت", arColor: "أصفر ذهبي" }
                                        : null;
                                reactions.push({
                                    gas: gasFromAnion,
                                    precip,
                                    eq: eqText,
                                    note,
                                    identifiedFrom: srcId,
                                    thermic: "exo",
                                    consumedSolids: [srcId],
                                });
                            }
                        }
                    }
                }

                if (vesselIds.indexOf("feso4") >= 0 && vesselIds.indexOf("h2so4c") >= 0) {
                    const feItem = contents.find((c) => c.id === "feso4");
                    const feDissolved = feItem && (!feItem.solid || feItem.dissolved);
                    const nitrateSource = vesselIds.find((id) => {
                        if (id === "h2so4c" || id === "feso4") return false;
                        const m = ID_IONS[id];
                        return m && m.an.indexOf("NO3-") >= 0;
                    });
                    if (feDissolved && nitrateSource && !seen.has("BROWN_RING_TEST")) {
                        seen.add("BROWN_RING_TEST");
                        reactions.push({
                            brownRing: true,
                            eq: "NO3-(aq) + 3Fe2+(aq) + 4H+(aq) -> NO(g) + 3Fe3+(aq) + 2H2O(l)\nFe2+(aq) + NO(aq) + 5H2O(l) -> [Fe(H2O)5NO]2+(aq)\n[Fe(H2O)5NO]2+(aq) + SO4^2-(aq) -> [Fe(H2O)5NO]SO4(s)",

                            identifiedFrom: nitrateSource,
                            thermic: "exo",
                        });
                    }
                }

                for (const c of ions.cat) {
                    for (const a of ions.an) {
                        if (c.from === a.from) continue;
                        const key = c.ion + "|" + a.ion;
                        if (seen.has(key)) continue;
                        seen.add(key);
                        const p = PRECIPITATE_TABLE[key];
                        if (p) {
                            reactions.push({

                                    ar: p.ar,

                const has = (id) => vesselIds.includes(id);

                        color: r.precip.color,
                        ar: r.precip.ar || "",
                        arColor: r.precip.arColor || colorName(r.precip.color),
                    }));

                return { reactions, identifiedIon, identifiedItem, precipitates };

            let actx = null,

            function A() {
                if (!actx) {

            function noiseBuf(a, dur) {
                const n = Math.floor(a.sampleRate * dur),
                    b = a.createBuffer(1, n, a.sampleRate),
                    d = b.getChannelData(0);
                for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
                return b;

            function playPour() {
                if (!soundOn) return;
                const a = A();
                if (!a) return;
                const t = a.currentTime,
                    src = a.createBufferSource();
                src.buffer = noiseBuf(a, 0.45);
                const f = a.createBiquadFilter();
                f.type = "bandpass";
                f.frequency.setValueAtTime(600, t);
                f.frequency.exponentialRampToValueAtTime(1500, t + 0.4);
                f.Q.value = 1.4;
                const g = a.createGain();
                g.gain.setValueAtTime(0.001, t);
                g.gain.exponentialRampToValueAtTime(0.14, t + 0.05);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
                src.connect(f).connect(g).connect(a.destination);
                src.start(t);
                src.stop(t + 0.5);
            }

                dur = dur || 1.2;

                const a = A();

                const t = a.currentTime,

                src.buffer = noiseBuf(a, dur);
                const f = a.createBiquadFilter();

                f.frequency.value = 3200;
                const g = a.createGain();
                g.gain.setValueAtTime(0.001, t);
                g.gain.exponentialRampToValueAtTime(0.1, t + 0.12);

            function resize() {
                const wrap = cvs.parentElement;
                if (!wrap) return;
                const aw = wrap.clientWidth,
                    ah = wrap.clientHeight;
                if (aw < 10 || ah < 10) return;
                const wrapAspect = aw / ah;
                const baseAspect = BASE_W / BASE_H;
                let newW, newH;
                if (wrapAspect > baseAspect) {
                    newH = BASE_H;
                    newW = Math.round(newH * wrapAspect);
                } else {
                    newW = BASE_W;
                    newH = Math.round(newW / wrapAspect);
                }
                if (newW < BASE_W) {
                    newW = BASE_W;
                    newH = Math.round(newW / wrapAspect);
                }
                if (newH < BASE_H) {
                    newH = BASE_H;
                    newW = Math.round(newH * wrapAspect);
                }
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const targetCanvasW = Math.round(aw * dpr),
                    targetCanvasH = Math.round(ah * dpr);
                if (
                    W === newW &&
                    H === newH &&
                    cvs.width === targetCanvasW &&
                    cvs.height === targetCanvasH &&
                    lastResizeW === aw &&
                    lastResizeH === ah
                )
                    return;
                lastResizeW = aw;
                lastResizeH = ah;
                W = newW;
                H = newH;
                cvs.style.width = aw + "px";
                cvs.style.height = ah + "px";
                cvs.width = targetCanvasW;
                cvs.height = targetCanvasH;
                const s = aw / W;
                ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
                state.burner.x = W - 170;
                const dims = tubeDimensions();
                for (const v of vessels) {
                    if (v.type === "tube" && (v.w !== dims.w || v.h !== dims.h)) {
                        const bottom = v.y + v.h;
                        v.w = dims.w;
                        v.h = dims.h;
                        v.y = bottom - v.h;
                        if (v.y < 20) {

                        }

            function toCanvas(clientX, clientY) {

            function mixColor(contents) {
                let r = 0,
                    g = 0,
                    b = 0,
                    w = 0,
                    a = 0;
                const all = allReagents();
                for (const c of contents) {
                    const R = all[c.id];
                    if (!R || isPaper(c.id)) continue;
                    if (R.solid === true && !c.dissolved) continue;
                    const rgb = hexToRgb(R.c);
                    const wt = c.vol * (R.a + 0.35);
                    r += rgb.r * wt;
                    g += rgb.g * wt;
                    b += rgb.b * wt;
                    w += wt;
                    a = Math.max(a, R.a);
                }
                if (w === 0) return { r: 220, g: 235, b: 245, a: 0 };
                const fr = r / w,
                    fg = g / w,
                    fb = b / w;
                const brightness = (fr + fg + fb) / 3;
                const saturation = Math.max(fr, fg, fb) - Math.min(fr, fg, fb);
                let finalAlpha = Math.min(1, a + 0.35);
                if (saturation < 22 && brightness > 195) finalAlpha = Math.min(finalAlpha, 0.24);
                if (saturation < 12 && brightness > 210) finalAlpha = Math.min(finalAlpha, 0.16);
                return { r: Math.round(fr), g: Math.round(fg), b: Math.round(fb), a: finalAlpha };
            }

            function startReactions(v) {

            function applyNextReaction(v) {

            function applyReaction(v, rxn) {
                if (rxn.consumedSolids) {
                    for (const id of rxn.consumedSolids) {
                        const idx = v.contents.findIndex((c) => c.id === id && !c.dissolved);

            function vesselPath(c, v) {
                const x = v.x,
                    y = v.y,
                    w = v.w,
                    h = v.h;
                const r = v.type === "tube" ? w / 2 : 13;
                c.beginPath();
                c.moveTo(x, y);
                c.lineTo(x, y + h - r);
                c.quadraticCurveTo(x, y + h, x + r, y + h);
                c.lineTo(x + w - r, y + h);
                c.quadraticCurveTo(x + w, y + h, x + w, y + h - r);

                c.closePath();

            function drawBackdrop(t) {
                const g = ctx.createLinearGradient(0, 0, 0, H);
                g.addColorStop(0, "#0f2a35");
                g.addColorStop(1, "#08161d");
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, W, H);
                ctx.strokeStyle = "rgba(120,220,255,.05)";
                ctx.lineWidth = 1;
                for (let x = 0; x < W; x += 64) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, BENCH_TOP);
                    ctx.stroke();
