            let last = performance.now();

            function loop(now) {
                try {
                    const dt = Math.min(0.05, (now - last) / 1000);
                    last = now;
                    state.time = now / 1000;
                    const t = state.time;
                    update(dt, t);
                    ctx.clearRect(0, 0, W, H);
                    drawBackdrop(t);
                    drawBench();
                    drawBurner(t);
                    drawTubes(t);
                    for (const v of vessels) drawVessel(v, t);
                    for (const v of vessels) drawStopper(v, t);
                    if (vessels.length >= 2) {
                        for (let i = 0; i < vessels.length; i++) {
                            drawVesselNumber(vessels[i], i + 1);
                        }
                    }
                    for (const p of papers) drawPaperStrip(p, t);
                    drawSmokeClouds(dt);
                    drawThermometer();
                    drawWire();
                    drawDroplets(dt);
                    drawPourDrips(dt);
                    drawSparks(dt);
                    if (now - state.lastEqRender > 600) {
                        state.lastEqRender = now;
                        renderEquations(false);
                    }
                } catch (err) {
                    console.error(err);
                }
                requestAnimationFrame(loop);
            }

            function update(dt, t) {
                const b = state.burner;
                if (mysteryShaking) {
                    const elapsed = performance.now() - mysteryShaking.startTime;
                    const v = mysteryShaking.vessel;
                    if (!vessels.includes(v)) {
                        mysteryShaking = null;
                    } else {
                        v.shakeT = Math.max(2.0, v.shakeT);
                        if (elapsed >= mysteryShaking.duration) {
                            vanishVesselAndSpawnPaper(v);
                            mysteryShaking = null;
                        }
                    }
                }

                if (state.running) {
                    for (const tube of tubes) {
                        const a = tube.from,
                            bv = tube.to;
                        if (!vessels.includes(a) || !vessels.includes(bv)) continue;
                        if (!a.reactionStarted) continue;
                        if (a.activeGas && a.activeGas.life > 0) {
                            if (a.hasStopper) continue;
                            if (bv.hasStopper) continue;
                            if (!bv.gasTypes) bv.gasTypes = [];
                            if (!bv.gasTypes.includes(a.activeGas.type)) {
                                bv.gasTypes.push(a.activeGas.type);
                            }
                            if (a.activeGas.type === "CO2" && bv.precip && bv.precip.formula === "CaCO3") {
                                bv.co2EverExposed = true;
                            }
                            if (bv.gasTypes.length >= 2) {
                                for (let i = 0; i < bv.gasTypes.length; i++) {
                                    for (let j = i + 1; j < bv.gasTypes.length; j++) {
                                        const t1 = bv.gasTypes[i],
                                            t2 = bv.gasTypes[j];
                                        const k1 = t1 + "|" + t2,
                                            k2 = t2 + "|" + t1;
                                        const rx = GAS_GAS_REACTIONS[k1] || GAS_GAS_REACTIONS[k2];
                                        if (rx) {
                                            if (bv.mixKey !== k1) {
                                                bv.mixKey = k1;
                                                bv.mixRx = rx;
                                                const note = rx.note + " (" + t1 + " + " + t2 + ")";
                                                reactionHistory.unshift({ eq: rx.eq, note: note });
                                                if (reactionHistory.length > 30) reactionHistory.pop();
                                                renderHistory();
                                                addLog("💨 تفاعل غازين مختلطين [" + t1 + " + " + t2 + "]: " + rx.note);
                                                if (rx.precip && rx.precip.ar) {
                                                    addLog(
                                                        "🧪 راسب " +
                                                            rx.precip.formula +
                                                            " (" +
                                                            rx.precip.ar +
                                                            ") من تفاعل " +
                                                            t1 +
                                                            " + " +
                                                            t2
                                                    );
                                                }
                                                playFizz(2);
                                                playDing();
                                            }
                                        }
                                    }
                                }
                            }
                            if (bv.gasAmount < 100) {
                                bv.gasAmount = Math.min(100, bv.gasAmount + dt * GAS_RATE);
                            }
                            if (!bv.activeGas || bv.activeGas.life <= 0) {
                                bv.activeGas = { type: a.activeGas.type, life: 25, viaTube: true };
                            } else if (bv.activeGas.type !== a.activeGas.type) {
                                bv.activeGas.life = 25;
                            }
                            if (!bv.gasType) bv.gasType = a.activeGas.type;
                            if (bv.contents.length > 0) {
                                const targetIds = bv.contents.map((c) => c.id);
                                for (const id of targetIds) {
                                    const key = a.activeGas.type + "|" + id;
                                    const reaction = GAS_LIQUID_REACTIONS[key];
                                    if (reaction && !bv.reactedGases[key]) {
                                        bv.reactedGases[key] = true;
                                        applyGasReaction(bv, reaction, a.activeGas.type);
                                    }
                                }
                            }
                        }
                    }
                }

                for (const v of vessels) {
                    if (v.ggCooldown > 0) v.ggCooldown = Math.max(0, v.ggCooldown - dt);
                    if (v.ggFlash > 0) v.ggFlash = Math.max(0, v.ggFlash - dt * 1.2);
                    if (v.gasTypes && v.gasTypes.length >= 2 && v.gasAmount > 3 && v.mixRx && state.running) {
                        if (v.mixRx.smoke) {
                            smokeClouds.push({
                                x: v.cx,
                                y: v.y - 30,
                                life: 0.55,
                                maxLife: 0.55,
                                r: Math.max(v.w, 50) * 0.9 + 14,
                            });
                        }
                    }
                    v.dispVol = lerp(v.dispVol, v.volume, Math.min(1, dt * 6));
                    if (v.colorTarget) {
                        const s = Math.min(1, dt * 1.2);
                        v.color.r = lerp(v.color.r, v.colorTarget.r, s);
                        v.color.g = lerp(v.color.g, v.colorTarget.g, s);
                        v.color.b = lerp(v.color.b, v.colorTarget.b, s);
                        v.color.a = lerp(v.color.a, v.colorTarget.a, s);
                        const dr = Math.abs(v.color.r - v.colorTarget.r),
                            dg = Math.abs(v.color.g - v.colorTarget.g),
                            db = Math.abs(v.color.b - v.colorTarget.b),
                            da = Math.abs(v.color.a - v.colorTarget.a) * 255;
                        if (dr + dg + db + da < 4) v.colorTarget = null;
                    }
                    v.precipAmt = lerp(v.precipAmt, v.precipTarget, Math.min(1, dt * 1.4));
                    v.brownRingProgress = lerp(v.brownRingProgress, v.brownRing ? 1 : 0, Math.min(1, dt * 2.5));
                    if (v.shakeT > 0) {
                        const speed = v.shakeT > 1.5 ? 0.3 : 0.65;
                        v.shakeT = Math.max(0, v.shakeT - dt / speed);
                    }
                    if (v.thermicT > 0 && v.thermicT < 100) v.thermicT = Math.max(0, v.thermicT - dt);

                    if (!state.running) continue;

                    const hasIncoming = tubes.some(function (tb) {
                        return (
                            tb.to === v &&
                            tb.from.activeGas &&
                            tb.from.activeGas.life > 0 &&
                            tb.from.reactionStarted &&
                            !tb.from.hasStopper &&
                            !v.hasStopper
                        );
                    });

                    if (v.hasStopper) {
                        v.gasConsumed = false;
                    } else if (v.gasAmount > 0 && !hasIncoming) {
                        v.gasAmount = Math.max(0, v.gasAmount - dt * GAS_RATE);
                        if (v.gasAmount <= 0 && !v.gasConsumed && !v.continuousDecomp) {
                            v.gasConsumed = true;
                            v.activeGas = null;
                            v.gasType = null;
                            v.gasTypes = [];
                            v.mixRx = null;
                            v.mixKey = null;
                        }
                    }

                    if (v.activeGas) {
                        if (v.hasStopper) {
                            v.activeGas.life = 25;
                        } else if (v.activeGas.viaTube) {
                            if (hasIncoming && state.running) {
                                v.activeGas.life = 25;
                            } else {
                                v.activeGas.life -= dt * 3;
                                if (v.activeGas.life <= 0) v.activeGas = null;
                            }
                        } else if (v.gasAmount > 0) {
                            v.activeGas.life = 25;
                        } else if (v.contents.length > 0 && !v.gasConsumed) {
                            v.activeGas.life = Math.max(v.activeGas.life, 20);
                        } else {
                            v.activeGas.life -= dt * 2.5;
                            if (v.activeGas.life <= 0) v.activeGas = null;
                        }
                    }

                    if (v.precip && v.precip.formula === "CaCO3" && state.running && v.co2EverExposed) {
                        const co2Present = (v.activeGas && v.activeGas.type === "CO2") || v.gasAmount > 0;
                        if (co2Present) {
                            v.dissolveTimer += dt;
                            if (v.dissolveTimer > 12 && v.co2DissolveStage === 0) {
                                v.co2DissolveStage = 1;
                                addLog("🔵 بدأ الراسب الأبيض يذوب تدريجيًا — تكوّن Ca(HCO3)2 الذائب");
                                setVesselEquation(
                                    v,
                                    "CaCO3(s) + H2O(l) + CO2(g) -> Ca(HCO3)2(aq)",
                                    "الراسب الأبيض يذوب بمرور CO2 الطويل"
                                );
                                playDing();
                            }
                            if (v.co2DissolveStage === 1) {
                                v.precipTarget = Math.max(0, 1 - (v.dissolveTimer - 12) / 18);
                            }
                            if (v.dissolveTimer > 30 && v.co2DissolveStage === 1) {
                                v.precip = null;
                                v.precipTarget = 0;
                                v.colorTarget = { r: 200, g: 232, b: 250, a: 0.2 };
                                v.co2DissolveStage = 2;
                                addLog("🔵 زال تعكر ماء الجير تمامًا — Ca(HCO3)2 ذائب في الماء");
                                setVesselEquation(
                                    v,
                                    "CaCO3(s) + H2O(l) + CO2(g) -> Ca(HCO3)2(aq)",
                                    "زال التعكر تمامًا — الراسب اختفى"
                                );
                                playDing();
                            }
                        }
                    }
                }

                if (state.running) {
                    for (const v of vessels) {
                        if (v.ggPartner) {
                            if (!vessels.includes(v.ggPartner)) {
                                v.ggPartner = null;
                                continue;
                            }
                            const p = v.ggPartner;
                            if (v.hasStopper || p.hasStopper) {
                                v.ggPartner = null;
                                continue;
                            }
                            if (!v.activeGas || !p.activeGas || v.activeGas.life <= 0 || p.activeGas.life <= 0) {
                                v.ggPartner = null;
                                continue;
                            }
                            const dx = v.cx - p.cx;
                            const dy = v.y + v.h / 2 - (p.y + p.h / 2);
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist > 180) {
                                v.ggPartner = null;
                                continue;
                            }
                            const key = v.activeGas.type + "|" + p.activeGas.type;
                            const rx = GAS_GAS_REACTIONS[key];
                            if (!rx) {
                                v.ggPartner = null;
                                continue;
                            }
                            const x = (v.cx + p.cx) / 2;
                            const topY = Math.min(v.y, p.y) - 28;
                            const smokeR = Math.max(v.w, p.w) * 1.1 + 18;
                            if (rx.smoke) {
                                smokeClouds.push({ x: x, y: topY, life: 0.55, maxLife: 0.55, r: smokeR });
                                smokeClouds.push({
                                    x: x - smokeR * 0.3,
                                    y: topY + 10,
                                    life: 0.5,
                                    maxLife: 0.5,
                                    r: smokeR * 0.8,
                                });
                                smokeClouds.push({
                                    x: x + smokeR * 0.3,
                                    y: topY + 10,
                                    life: 0.5,
                                    maxLife: 0.5,
                                    r: smokeR * 0.8,
                                });
                            }
                        }
                    }
                    for (let i = 0; i < vessels.length; i++) {
                        for (let j = i + 1; j < vessels.length; j++) {
                            const a = vessels[i],
                                b2 = vessels[j];
                            if (a.hasStopper || b2.hasStopper) continue;
                            if (!a.activeGas || !b2.activeGas) continue;
                            if (a.activeGas.life <= 0 || b2.activeGas.life <= 0) continue;
                            if (a.ggPartner === b2 || b2.ggPartner === a) continue;
                            const dx = a.cx - b2.cx;
                            const dy = a.y + a.h / 2 - (b2.y + b2.h / 2);
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist > 170) continue;
                            const key = a.activeGas.type + "|" + b2.activeGas.type;
                            const rx = GAS_GAS_REACTIONS[key];
                            if (!rx) continue;
                            if (a.ggPartner && a.ggPartner !== b2) continue;
                            if (b2.ggPartner && b2.ggPartner !== a) continue;
                            triggerGasGasReaction(a, b2, rx);
                            a.ggPartner = b2;
                            b2.ggPartner = a;
                        }
                    }
                }

                if (!state.running) {
                    updateThermoPanel();
                    return;
                }

                for (const v of vessels) {
                    if (v.continuousDecomp && v.reactionStarted && v.contents.length === 1) {
                        const da = v.continuousDecomp;
                        if (da.gas) {
                            if (!v.activeGas || v.activeGas.life <= 0) {
                                v.activeGas = { type: da.gas, life: 25, viaTube: false };
                                v.gasType = da.gas;
                            } else {
                                v.activeGas.life = Math.max(v.activeGas.life, 20);
                            }
                            v.gasAmount = Math.min(100, (v.gasAmount || 0) + dt * 6);
                            if (!v.gasTypes) v.gasTypes = [];
                            if (!v.gasTypes.includes(da.gas)) v.gasTypes.push(da.gas);
                            if (Math.random() < dt * 20 && v.volume > 1) {
                                v.bubbles.push({
                                    x: v.x + 8 + Math.random() * (v.w - 16),
                                    y: v.y + v.h - 10 - Math.random() * 12,
                                    r: 1.5 + Math.random() * 3,
                                    vy: -(45 + Math.random() * 60),
                                    a: 1,
                                });
                            }
                        }
                        if (da.precip) {
                            v.precipTarget = Math.max(v.precipTarget, 0.7 + 0.3 * Math.abs(Math.sin(t * 1.5)));
                            v.precipAmt = Math.max(v.precipAmt, 0.3);
                        }
                        if (v.thermicT < 2) v.thermicT = 3;
                    }

                    const nearFlame =
                        state.burnerOn &&
                        state.showBurner &&
                        v.cx > b.x - 70 &&
                        v.cx < b.x + 70 &&
                        v.bottom > b.base - 140 &&
                        v.bottom < b.base + 40;
                    v.heating = nearFlame;
                    if (nearFlame) {
                        v.temp = Math.min(105, v.temp + dt * 38);
                    } else if (v.thermicT > 0 && v.thermic === "exo") {
                        v.temp = Math.min(120, v.temp + dt * 6);
                    } else if (v.thermicT > 0 && v.thermic === "endo") {
                        v.temp = Math.max(5, v.temp - dt * 5);
                    } else {
                        v.temp = lerp(v.temp, 25, Math.min(1, dt * 0.3));
                    }

                    if (v.contents.length && nearFlame && v.temp > 70) {
                        let hr = null;
                        for (const c of v.contents) {
                            if (HEAT_REACTIONS[c.id]) {
                                hr = HEAT_REACTIONS[c.id];
                                break;
                            }
                        }
                        if (hr) {
                            v.naturalHeatTimer += dt;
                            if (v.naturalHeatTimer > 1.2) {
                                if (hr.gas) {
                                    v.activeGas = { type: hr.gas, life: 25, viaTube: false };
                                    v.gasType = hr.gas;
                                    if (!v.gasTypes.includes(hr.gas)) v.gasTypes.push(hr.gas);
                                }
                                if (hr.tint) v.colorTarget = Object.assign({}, hexToRgb(hr.tint), { a: 0.35 });
                                if (hr.thermic) {
                                    v.thermic = hr.thermic;
                                    v.thermicT = 8;
                                }
                                if (!v.heatReactionDone) {
                                    setVesselEquation(v, hr.eq, hr.note);
                                    addLog("🔥 تسخين: " + hr.note);
                                    if (hr.thermic === "endo") addLog("❄️ تفاعل ماص للحرارة (حراري)");
                                    v.heatReactionDone = true;
                                }
                            }
                        }
                    } else if (!nearFlame) {
                        v.naturalHeatTimer = 0;
                        v.heatReactionDone = false;
                    }

                    if (!v.reactionStarted) continue;
                    if (v.reactionQueue.length) {
                        v.reactionTimer += dt;
                        if (v.reactionTimer > 3.5) applyNextReaction(v);
                    }

                    if (v.precip) {
                        if (v.precip.onHeat && !v.onHeatTriggered && v.temp > 55) {
                            v.heatTimer += dt;
                            if (v.heatTimer > 2) {
                                v.onHeatTriggered = true;
                                const newColor = v.precip.onHeat.color;
                                const newArColor = v.precip.onHeat.arColor || colorName(newColor);
                                v.precip = Object.assign({}, v.precip, { color: newColor, arColor: newArColor });
                                addLog("🔥 تسخين: " + v.precip.formula + " — اللون أصبح " + newArColor);
                                setVesselEquation(
                                    v,
                                    v.precip.onHeat.eq || v.precip.formula + " --Δ--> ناتج",
                                    v.precip.onHeat.note
                                );
                                playDing();
                                playFizz(0.6);
                                if (v.precip.onHeat.eq && v.precip.onHeat.eq.indexOf("CO2") >= 0) {
                                    v.activeGas = { type: "CO2", life: 25, viaTube: false };
                                    v.gasType = "CO2";
                                    if (!v.gasTypes.includes("CO2")) v.gasTypes.push("CO2");
                                }
                            }
                        } else if (!v.precip.onHeat) {
                            v.heatTimer = 0;
                        }
                        if (v.precip.onStand && !v.onStandTriggered) {
                            v.standTimer += dt;
                            if (v.standTimer > 8) {
                                v.onStandTriggered = true;
                                const newColor = v.precip.onStand.color;
                                const newArColor = v.precip.onStand.arColor || colorName(newColor);
                                v.precip = Object.assign({}, v.precip, { color: newColor, arColor: newArColor });
                                addLog("⏳ بالوقوف: " + v.precip.formula + " — اللون أصبح " + newArColor);
                                setVesselEquation(v, v.precip.formula + " -> ... (تحول تلقائي)", v.precip.onStand.note);
                                playDing();
                            }
                        }
                        if (v.precip.oxidize && !v.oxidized) {
                            v.oxidizeTimer += dt;
                            if (v.oxidizeTimer > 3) {
                                v.oxidized = true;
                                v.precip = Object.assign({}, v.precip, { color: "#a83232", arColor: "بني محمر" });
                                addLog("🌫️ الأكسدة بالهواء: اللون أصبح بني محمر");
                            }
                        }
                    }

                    if (v.temp > 88 && v.volume > 2 && Math.random() < dt * 14) {
                        v.bubbles.push({
                            x: v.x + 8 + Math.random() * (v.w - 16),
                            y: v.y + v.h - 8,
                            r: 1.6 + Math.random() * 2.6,
                            vy: -(35 + Math.random() * 45),
                            a: 0.9,
                        });
                    }
                    if (v.activeGas && v.activeGas.life > 0 && v.volume > 1 && Math.random() < dt * 20) {
                        v.bubbles.push({
                            x: v.x + 8 + Math.random() * (v.w - 16),
                            y: v.y + v.h - 10 - Math.random() * 12,
                            r: 1.5 + Math.random() * 3,
                            vy: -(45 + Math.random() * 60),
                            a: 1,
                        });
                    }

                    const lvlTop = v.y + v.h - Math.min(v.h - 8, (v.dispVol / v.cap) * (v.h - 10));
                    for (const bb of v.bubbles) {
                        bb.y += bb.vy * dt;
                        bb.x += Math.sin(t * 5 + bb.y * 0.08) * 0.4;
                        if (bb.y < lvlTop + 3) bb.a -= dt * 2.2;
                    }
                    v.bubbles = v.bubbles.filter((bb) => bb.a > 0.05 && bb.y > v.y - 4);
                }

                for (const p of papers) updatePaperReaction(p, dt);
                for (let i = papers.length - 1; i >= 0; i--) {
                    if (papers[i].dead) papers.splice(i, 1);
                }

                updateThermoPanel();
            }

            function updateThermoPanel() {
                if (!state.showThermo) return;
                let maxT = 25;
                for (const v of vessels) if (v.volume > 0) maxT = Math.max(maxT, v.temp);
                const tv = document.getElementById("tempVal");
                if (tv) tv.textContent = Math.round(maxT);
                const fill = document.getElementById("tempFill");
                if (fill) {
                    fill.style.width = clamp((maxT / 120) * 100, 4, 100) + "%";
                    fill.style.background =
                        maxT > 80
                            ? "linear-gradient(90deg,#ff7043,#ff1744)"
                            : maxT > 45
                              ? "linear-gradient(90deg,#ffb300,#ff7043)"
                              : "linear-gradient(90deg,#2196f3,#4dd0e1)";
                }
                const trendEl = document.getElementById("tempTrend");
                if (!trendEl) return;
                const trends = [];
                vessels.forEach(function (v, i) {
                    if (v.thermic && v.thermicT > 0 && v.thermicT < 100) {
                        trends.push({ idx: i + 1, type: v.thermic });
                    }
                });
                if (!trends.length) {
                    trendEl.innerHTML = '<div class="empty">لا يوجد تفاعل حراري حالي</div>';
                    return;
                }
                let html = "";
                for (const tr of trends) {
                    if (tr.type === "exo") {
                        html +=
                            '<div class="tag exo"><span class="ico">🔥</span><span class="lbl">تفاعل طارد</span><span class="num">أنبوب ' +
                            tr.idx +
                            "</span></div>";
                    } else {
                        html +=
                            '<div class="tag endo"><span class="ico">❄️</span><span class="lbl">تفاعل ماص</span><span class="num">أنبوب ' +
                            tr.idx +
                            "</span></div>";
                    }
                }
                trendEl.innerHTML = html;
            }

            function applyGasReaction(vessel, reaction, gasType) {
                if (gasType === "CO2" && reaction.precip && reaction.precip.formula === "CaCO3") {
                    vessel.co2EverExposed = true;
                }
                if (reaction.precip) {
                    vessel.precip = {
                        formula: reaction.precip.formula,
                        color: reaction.precip.color,
                        ar: reaction.precip.ar,
                        note: reaction.note,
                        progressive: reaction.progressive,
                        arColor: reaction.precip.arColor,
                    };
                    vessel.precipTarget = 1;
                    vessel.precipAmt = Math.max(vessel.precipAmt, 0.15);
                    vessel.co2DissolveStage = 0;
                    vessel.dissolveTimer = 0;
                    if (reaction.progressive) {
                        vessel.colorTarget = { r: 242, g: 246, b: 252, a: 0.52 };
                    }
                }
                if (reaction.tint) {
                    vessel.colorTarget = Object.assign({}, hexToRgb(reaction.tint), {
                        a: reaction.tint === "#f5f5f5" ? 0.22 : 1,
                    });
                }
                if (reaction.smoke) {
                    smokeClouds.push({ x: vessel.cx, y: vessel.y - 20, life: 2.5, maxLife: 2.5, r: 50 });
                }
                if (reaction.precip)
                    addLog(
                        "🧪 راسب " +
                            reaction.precip.formula +
                            " — لونه: " +
                            (reaction.precip.arColor || colorName(reaction.precip.color))
                    );
                if (reaction.tint && reaction.tint !== "#f5f5f5") addLog("🎨 لون المحلول: " + colorName(reaction.tint));
                if (reaction.thermic) {
                    vessel.thermic = reaction.thermic;
                    vessel.thermicT = 8;
                    if (reaction.thermic === "exo") addLog("🔥 تفاعل طارد للحرارة");
                    else if (reaction.thermic === "endo") addLog("❄️ تفاعل ماص للحرارة");
                }
                setVesselEquation(vessel, reaction.eq, reaction.note);
                playDing();
                playFizz(1.2);
            }

            function hitTestStopper(p) {
                for (let i = vessels.length - 1; i >= 0; i--) {
                    const v = vessels[i];
                    if (!v.hasStopper) continue;
                    const op = v.opening;
                    const dx = p.x - op.x,
                        dy = p.y - op.y;
                    const r = Math.max(16, v.w * 0.55);
                    if (dx * dx + dy * dy <= (r + 8) * (r + 8)) return v;
                }
                return null;
            }
            function hitTestVesselOpening(p) {
                for (let i = vessels.length - 1; i >= 0; i--) {
                    const v = vessels[i];
                    if (v.type !== "tube" && v.type !== "beaker") continue;
                    const op = v.opening;
                    const dx = p.x - op.x,
                        dy = p.y - op.y;
                    if (dx * dx + dy * dy <= 26 * 26) return v;
                }
                return null;
            }
            function hitTestVessel(p) {
                for (let i = vessels.length - 1; i >= 0; i--) {
                    const v = vessels[i];
                    const lx = p.x,
                        ly = p.y;
                    if (lx >= v.x - 14 && lx <= v.x + v.w + 14 && ly >= v.y - 14 && ly <= v.y + v.h + 6) {
                        return { vessel: v, localX: lx, localY: ly };
                    }
                }
                return null;
            }
            function hitTestPaper(p) {
                for (let i = papers.length - 1; i >= 0; i--) {
                    const pp = papers[i];
                    if (p.x >= pp.x - 8 && p.x <= pp.x + pp.w + 8 && p.y >= pp.y - 8 && p.y <= pp.y + pp.h + 8)
                        return pp;
                }
                return null;
            }
            function hitTestBurner(p) {
                if (!state.showBurner) return false;
                const b = state.burner;
                return p.x > b.x - 50 && p.x < b.x + 50 && p.y > b.base - 120 && p.y < b.base + 20;
            }
            function hitTestTube(p) {
                for (let i = tubes.length - 1; i >= 0; i--) {
                    const tube = tubes[i];
                    const a = tube.from,
                        b = tube.to;
                    if (!vessels.includes(a) || !vessels.includes(b)) continue;
                    const oa = a.opening,
                        ob = b.opening;
                    const cpx = (oa.x + ob.x) / 2;
                    const cpy = Math.min(oa.y, ob.y) - 70;
                    for (let t = 0; t <= 1.001; t += 0.08) {
                        const px = (1 - t) * (1 - t) * oa.x + 2 * (1 - t) * t * cpx + t * t * ob.x;
                        const py = (1 - t) * (1 - t) * oa.y + 2 * (1 - t) * t * cpy + t * t * ob.y;
                        const dx = p.x - px,
                            dy = p.y - py;
                        if (dx * dx + dy * dy < 225) return { tube, index: i };
                    }
                }
                return null;
            }

            const shelfStack = document.getElementById("shelfStack");
            const shelfTabs = document.getElementById("shelfTabs");
            const dragGhost = document.getElementById("dragGhost");
            const shelfArrowLeft = document.getElementById("shelfArrowLeft");
            const shelfArrowRight = document.getElementById("shelfArrowRight");
            const shelfElements = {};
            let activeShelfEl = null;

            function buildShelfEl(tab) {
                const sec = document.createElement("section");
                sec.className = "shelf";
                sec.dataset.tab = tab;
                const label = document.createElement("div");
                label.className = "shelf-label";
                label.textContent =
                    tab === "pap" ? "الأوراق" : tab === "rea" ? "كواشف" : tab === "cat" ? "كاتيونات" : "أنيونات";
                sec.appendChild(label);
                if (tab === "pap") {
                    for (const id in PAPERS) {
                        const P = PAPERS[id];
                        if (id === "mysteryPaper") continue;
                        const el = document.createElement("div");
                        el.className = "paper-item";
                        el.dataset.id = id;
                        if (P.rod) {
                            el.innerHTML =
                                '<div class="rod" data-tip="' +
                                id +
                                '" style="background:linear-gradient(180deg,#f0f0f0,#c0c0c0);border-color:' +
                                P.cap +
                                '"></div><div class="name">' +
                                P.label +
                                '</div><div class="ar">' +
                                P.ar +
                                "</div>";
                        } else {
                            el.innerHTML =
                                '<div class="sheet" style="background:linear-gradient(180deg,' +
                                P.color +
                                "," +
                                P.color +
                                "dd);border-color:" +
                                P.cap +
                                '"></div><div class="name">' +
                                P.label +
                                '</div><div class="ar">' +
                                P.ar +
                                "</div>";
                        }
                        el.addEventListener("pointerdown", function (e) {
                            onShelfPointerDown(e, id, "paper");
                        });
                        sec.appendChild(el);
                    }
                } else {
                    let items;
                    if (tab === "g1") items = ANIONS_G1;
                    else if (tab === "g2") items = ANIONS_G2;
                    else if (tab === "g3") items = ANIONS_G3;
                    else if (tab === "cat") items = CATIONS;
                    else items = REAGENTS;
                    for (const id in items) {
                        const R = items[id];
                        const el = document.createElement("div");
                        el.className = "bottle-item";
                        el.dataset.id = id;
                        const isSolid = R.solid === true;
                        el.innerHTML =
                            '<div class="cap" style="background:' +
                            R.cap +

                    );
                    playDing();
                    renderIonDisplay();
                    renderEquations(true);
                    showToast("🧪 تمت إضافة أنبوب جديد", "success");
                } else if (action === "add-beaker") {
                    let count = 0;
                    for (const v of vessels) if (v.type === "beaker") count++;
                    if (count >= 10) {
                        showToast("الحد الأقصى 10 كؤوس", "warn");
                        return;
                    }
                    vessels.push(
                        new Vessel({
                            id: "beaker_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
                            type: "beaker",
                            x: 120 + Math.random() * Math.max(200, W - 300),
                            y: 305,
                            w: 116,
                            h: 127,
                            cap: 140,
                        })
                    );
                    playDing();
                    renderIonDisplay();
                    renderEquations(true);
                    showToast("🥃 تمت إضافة كأس جديد", "success");
                } else if (action === "add-burner") {
                    state.showBurner = !state.showBurner;
                    if (!state.showBurner) {
                        state.burnerOn = false;
                        state.wire.active = false;
                    }
                    btn.classList.toggle("on", state.showBurner);
                    const flameBtn = document.querySelector('.tool-btn[data-action="flame-test"]');
                    if (flameBtn) {
                        flameBtn.disabled = !state.showBurner;
                        if (!state.showBurner) {
                            flameBtn.classList.remove("on");
                            state.wire.active = false;
                            state.wire.loaded = null;
                            state.wire.color = null;
                        }
                    }
                    showToast(state.showBurner ? "🔥 ظهر الموقد" : "❄️ اختفى الموقد", "info");
                } else if (action === "add-thermo") {
                    state.showThermo = !state.showThermo;
                    btn.classList.toggle("on", state.showThermo);
                    document.getElementById("thermoCard").style.display = state.showThermo ? "block" : "none";
                    showToast(state.showThermo ? "🌡️ ميزان الحرارة ظاهر" : "ميزان الحرارة مخفي", "info");
                } else if (action === "flame-test") {
                    if (!state.showBurner) return;
                    state.wire.active = !state.wire.active;
                    if (!state.wire.active) {
                        state.wire.loaded = null;
                        state.wire.color = null;
                        state.burnerOn = false;
                    } else {
                        state.burnerOn = true;
                        state.wire.loaded = null;
                        state.wire.color = null;
                    }
                    btn.classList.toggle("on", state.wire.active);
                    showToast(state.wire.active ? "✨ سلك اللهب جاهز — اسحب عينة عليه" : "✨ سلك اللهب متوقف", "info");
                } else if (action === "gas-tube") {
                    state.gasTubeArmed = !state.gasTubeArmed;
                    state.gasTubeSource = null;
                    btn.classList.toggle("armed", state.gasTubeArmed);
                    playDing();
                    showToast(state.gasTubeArmed ? "🔗 اختر الوعاء الأول" : "إلغاء وضع التوصيل", "info");
                } else if (action === "react-toggle") {
                    if (state.running) {
                        state.running = false;
                        for (const v of vessels) {
                            v.activeGas = null;
                            v.gasAmount = 0;
                            v.gasType = null;
                            v.gasTypes = [];
                            v.mixRx = null;
                            v.mixKey = null;
                            v.ggPartner = null;
                            v.bubbles = [];
                            v.continuousDecomp = null;
                            v.reactionQueue = [];
                        }
                        smokeClouds = [];
                        showToast("⏸️ تم إيقاف التفاعل — توقف تصاعد الغاز", "info");
                    } else {
                        let anyUnstarted = false;
                        let anyReaction = false;
                        for (const v of vessels) {
                            if (v.volume > 0 && v.contents.length >= 1 && !v.reactionStarted) {
                                anyUnstarted = true;
                                break;
                            }
                        }
                        if (anyUnstarted) state.equation = null;
                        state.running = true;
                        for (const v of vessels) {
                            if (v.volume > 0 && v.contents.length >= 1 && !v.reactionStarted) {
                                v.shakeT = 0.6;
                                v.mixed = true;
                                v.reactionStarted = true;
                                if (startReactions(v)) {
                                    anyReaction = true;
                                } else {
                                    v.reactionStarted = false;
                                    v.mixed = false;
                                    v.shakeT = 0;
                                }
                            }
                        }
                        if (anyReaction) showToast("▶️ بدأ التفاعل", "success");
                        else showToast("لا يوجد تفاعل", "warn");
                    }
                    updateReactBtn();
                    playDing();
                } else if (action === "reset-reaction") {
                    for (const v of vessels) resetVesselReaction(v);
                    state.running = false;
                    state.equation = null;
                    updateReactBtn();
                    renderEquations(true);
                    renderIonDisplay();
                    smokeClouds = [];
                    showToast("🔄 أُعيد ضبط التفاعل — يمكنك إضافة مواد جديدة", "info");
                    playDing();
                } else if (action === "clean") {
                    for (const v of vessels) {
                        v.contents = [];
                        v.volume = 0;
                        v.dispVol = 0;
                        v.temp = 25;
                        v.color = { r: 220, g: 235, b: 245, a: 0 };
                        v.colorTarget = null;
                        v.precip = null;
                        v.precipAmt = 0;
                        v.precipTarget = 0;
                        v.bubbles = [];
                        v.mixed = true;
                        v.activeGas = null;
                        v.gasTypes = [];
                        v.angle = 0;
                        v.heatReacted = false;
                        v.smokeStarted = false;
                        v.dissolveTimer = 0;
                        v.exposed = false;
                        v.heatTimer = 0;
                        v.standTimer = 0;
                        v.onHeatTriggered = false;
                        v.onStandTriggered = false;
                        v.oxidizeTimer = 0;
                        v.oxidized = false;
                        v.reactionStarted = false;
                        v.reactedGases = {};
                        v.co2DissolveStage = 0;
                        v.co2EverExposed = false;
                        v.reactionQueue = [];
                        v.reactionTimer = 0;
                        v.heatReactionDone = false;
                        v.naturalHeatTimer = 0;
                        v.discIon = null;
                        v.discPrecip = null;
                        v.lastEq = null;
                        v.lastNote = null;
                        v.gasAmount = 0;
                        v.gasType = null;
                        v.hasStopper = false;
                        v.thermic = null;
                        v.thermicT = 0;
                        v.gasConsumed = false;
                        v.continuousDecomp = null;
                        v.ggCooldown = 0;
                        v.ggFlash = 0;
                        v.ggPartner = null;
                        v.mixRx = null;
                        v.mixKey = null;
                        v.shakeAccum = 0;
                        v.brownRing = false;
                        v.brownRingProgress = 0;
                    }
                    papers.length = 0;
                    state.equation = null;
                    state.running = false;
                    renderEquations(true);
                    renderIonDisplay();
                    droplets = [];
                    pourDrips = [];
                    smokeClouds = [];
                    sparks = [];
                    tubes.length = 0;
                    const ionEl = document.getElementById("ionDisplay");
                    ionEl.classList.add("empty");
                    ionEl.textContent = "— لم يُكتشف بعد —";
                    document.getElementById("lightBtn").classList.remove("show");
                    updateReactBtn();
                    playDing();
                    showToast("🫗 تم تفريغ جميع الأوعية", "success");
                } else if (action === "clear-all") {
                    vessels.length = 0;
                    papers.length = 0;
                    mysteryComboActivated = false;
                    easterEggTriggered = false;
                    mysteryShaking = null;
                    tubes.length = 0;
                    droplets = [];
                    pourDrips = [];
                    smokeClouds = [];
                    sparks = [];
                    state.wire.active = false;
                    state.wire.loaded = null;
                    state.wire.color = null;
                    state.burnerOn = false;
                    state.showBurner = false;
                    state.showThermo = false;
                    state.gasTubeArmed = false;
                    state.gasTubeSource = null;
                    state.running = false;
                    state.equation = null;
                    reactionHistory.length = 0;
                    renderEquations(true);
                    renderIonDisplay();
                    renderHistory();
                    logEl.innerHTML = "";
                    document.querySelectorAll(".tool-btn").forEach((b) => b.classList.remove("on", "armed"));
                    const soundBtn = document.querySelector('.tool-btn[data-action="sound"]');
                    if (soundBtn && soundOn) soundBtn.classList.add("on");
                    const flameBtn = document.querySelector('.tool-btn[data-action="flame-test"]');
                    if (flameBtn) flameBtn.disabled = true;
                    document.getElementById("thermoCard").style.display = "none";
                    document.getElementById("lightBtn").classList.remove("show");
                    const ionEl = document.getElementById("ionDisplay");
                    ionEl.classList.add("empty");
                    ionEl.textContent = "— لم يُكتشف بعد —";
                    updateReactBtn();
                    playDing();
                    showToast("🗑️ تم مسح كل شيء", "success");
                } else if (action === "sound") {
                    soundOn = !soundOn;
                    btn.classList.toggle("on", soundOn);
                    const ic = btn.querySelector(".ico");
                    if (ic) ic.textContent = soundOn ? "🔔" : "🔕";
                    if (soundOn) playDing();
                    showToast(soundOn ? "🔔 الصوت مفعّل" : "🔕 الصوت مكتوم", "info");
                }
            }

            function loadWire(id) {
                const ft = FLAME_TEST[id];
                if (!ft) {
                    playDing();
                    return;
                }
                state.wire.loaded = id;
                state.wire.color = ft.color;
                state.burnerOn = true;
                playDing();
                playFizz(0.7);
                setVesselEquation(
                    vessels[0] || { id: "flame" },
                    "العيّنة: " + (findItem(id).label || findItem(id).ion) + "  ->  " + ft.ion,
                    ft.note
                );
                showToast("✨ لهب " + ft.ion + " — " + ft.note, "success");
            }

            const logEl = document.getElementById("log");
            function addLog(msg) {
                const d = document.createElement("div");
                d.textContent = msg;
                logEl.prepend(d);
                while (logEl.children.length > 20) logEl.lastChild.remove();
            }

            function showToast(msg, type) {
                type = type || "info";
                let container = document.getElementById("toastContainer");
                if (!container) {
                    container = document.createElement("div");
                    container.id = "toastContainer";
                    document.body.appendChild(container);
                }
                const icons = { info: "ℹ️", success: "✅", warn: "⚠️", error: "❌" };
                const item = document.createElement("div");
                item.className = "toast-item " + type;
                const icon = document.createElement("span");
                icon.className = "ticon";
                icon.textContent = icons[type] || icons.info;
                const text = document.createElement("span");
                text.textContent = msg;
                item.appendChild(icon);
                item.appendChild(text);
                container.appendChild(item);
                while (container.children.length > 2) {
                    const oldest = container.firstChild;
                    if (oldest && oldest.parentNode) oldest.parentNode.removeChild(oldest);
                    else break;
                }
                setTimeout(function () {
                    item.classList.add("out");
                    setTimeout(function () {
                        if (item.parentNode) item.parentNode.removeChild(item);
                    }, 350);
                }, 1000);
            }
            function showError(msg) {
                showToast(msg, "error");
            }

            document.getElementById("brandIcon").addEventListener("dblclick", function () {
                A();
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    const el = document.documentElement;
                    if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
                    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen().catch(function () {});
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            });

            async function boot() {
                resize();
                renderEquations(true);
                renderIonDisplay();
                renderHistory();
                updateReactBtn();
                await new Promise(function (r) {
                    requestAnimationFrame(r);
                });
                resize();
                requestAnimationFrame(loop);
                document.getElementById("app").classList.add("show");
                requestAnimationFrame(updateArrows);
            }

            if (typeof ResizeObserver !== "undefined") {
                const ro = new ResizeObserver(function () {
                    resize();
                    updateArrows();
                });
                ro.observe(document.getElementById("canvasWrap"));
            } else {
                window.addEventListener("resize", function () {
                    setTimeout(resize, 100);
                    setTimeout(updateArrows, 100);
                });
            }
        </script>
    </body>
</html>
