function finishStartup(){
  const overlay=document.getElementById('startupOverlay');
  if(!overlay)return;
  overlay.classList.add('hide');
  setTimeout(function(){if(overlay.parentNode)overlay.remove();},700);
}

function startStartupTyping(){
  return new Promise(function(resolve){
    const textEl=document.getElementById('startupText');
    if(!textEl){resolve();return;}
    textEl.textContent='';
    let i=0;
    const t=setInterval(function(){
      textEl.textContent=DEV_TEXT.slice(0,++i);
      if(i>=DEV_TEXT.length){
        clearInterval(t);
        setTimeout(resolve,300);
      }
    },75);
  });
}

function startCloseTyping(){
  const overlay=document.getElementById('closeOverlay');
  const textEl=document.getElementById('closeText');
  if(!overlay||!textEl)return;
  if(overlay.dataset.active==='1')return;
  overlay.dataset.active='1';
  overlay.classList.add('show');
  textEl.textContent=DEV_TEXT;
  let i=DEV_TEXT.length;
  const t=setInterval(function(){
    if(i>0){i--;textEl.textContent=DEV_TEXT.slice(0,i);}
    else{clearInterval(t);}
  },55);
}

(async function startApp(){
  await startStartupTyping();
  await new Promise(function(resolve){setTimeout(resolve,1800);});
  await boot();
  finishStartup();
})();

window.addEventListener('beforeunload',function(){startCloseTyping();});

(function polyfillRoundRect(){
  if(typeof CanvasRenderingContext2D==='undefined')return;
  if(CanvasRenderingContext2D.prototype.roundRect)return;
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number')r=[r,r,r,r];
    else if(!Array.isArray(r))r=[0,0,0,0];
    else if(r.length===1)r=[r[0],r[0],r[0],r[0]];
    const tl=r[0],tr=r[1],br=r[2],bl=r[3];
    this.moveTo(x+tl,y);this.lineTo(x+w-tr,y);this.quadraticCurveTo(x+w,y,x+w,y+tr);
    this.lineTo(x+w,y+h-br);this.quadraticCurveTo(x+w,y+h,x+w-br,y+h);
    this.lineTo(x+bl,y+h);this.quadraticCurveTo(x,y+h,x,y+h-bl);this.lineTo(x,y+tl);
    this.quadraticCurveTo(x,y,x+tl,y);return this;
  };
})();

const SUB_DIGITS={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9'};
const SUP_CHARS={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'-'};

function ionHTML(str){
  let html='';
  let i=0;
  while(i<str.length){
    const ch=str[i];
    if(SUB_DIGITS[ch]){
      let buf='';
      while(i<str.length&&SUB_DIGITS[str[i]]){buf+=SUB_DIGITS[str[i]];i++;}
      html+='<sub>'+buf+'</sub>';
    }else if(SUP_CHARS[ch]){
      let buf='';
      while(i<str.length&&SUP_CHARS[str[i]]){buf+=SUP_CHARS[str[i]];i++;}
      if(buf.indexOf('-')>0&&buf.charAt(0)!=='-')buf='-'+buf.replace('-','');
      if(buf.indexOf('+')>0&&buf.charAt(0)!=='+')buf='+'+buf.replace('+','');
      html+='<sup>'+buf+'</sup>';
    }else{
      html+=ch;i++;
    }
  }
  return html;
}

function smartReact(vesselIds){
  const ions={cat:[],an:[]};
  for(const id of vesselIds){
    const map=ID_IONS[id];
    if(map){
      ions.cat.push(...map.cat.map(c=>({ion:c,from:id})));
      ions.an.push(...map.an.map(a=>({ion:a,from:id})));
    }
  }
  const reactions=[];
  const seen=new Set();
  const presentIds=vesselIds.slice();

  for(let i=0;i<presentIds.length;i++){
    for(let j=i+1;j<presentIds.length;j++){
      const a=presentIds[i],b=presentIds[j];
      const k1=a+'|'+b,k2=b+'|'+a;
      const sp=SPECIAL_PAIR_REACTIONS[k1]||SPECIAL_PAIR_REACTIONS[k2];
      if(!sp||sp.skip)continue;
      const spKey=(k1<k2)?k1:k2;
      if(seen.has('SP|'+spKey))continue;
      seen.add('SP|'+spKey);
      reactions.push({
        gas:sp.gas||null,
        tint:sp.tint||null,
        heat:sp.heat||null,
        precip:sp.precip?{
          formula:sp.precip.formula,
          color:sp.precip.color,
          ar:sp.precip.ar,
          arColor:sp.precip.arColor||colorName(sp.precip.color),
          light:sp.precip.light,
          onHeat:sp.precip.onHeat,
          onStand:sp.precip.onStand,
          oxidize:sp.precip.oxidize
        }:null,
        eq:sp.eq,note:sp.note,
        identifiedFrom:a,
        thermic:sp.thermic||'exo'
      });
    }
  }

  const strongAcidIds=['hcl','h2so4c','hno3'];
  const presentAcid=strongAcidIds.find(a=>vesselIds.includes(a));

  if(presentAcid){
    for(const srcId of vesselIds){
      const srcInfo=ID_IONS[srcId];
      if(!srcInfo)continue;
      for(const anion of srcInfo.an){
        const key='H+|'+anion;
        if(seen.has(key))continue;
        const eqKey=srcId+'|'+presentAcid;
        const eqText=ACID_EQ_MAP[eqKey];
        if(!eqText)continue;
        const gasFromAnion={
          'CO3^2-':'CO2','HCO3^-':'CO2','SO3^2-':'SO2','S^2-':'H2S','S2O3^2-':'SO2','NO2^-':'NO'
        }[anion];
        if(!gasFromAnion)continue;
        seen.add(key);
        const note={
          'CO2':'تصاعد CO₂ — يعكّر ماء الجير',
          'SO2':'تصاعد SO₂ — رائحة نفاذة',
          'H2S':'تصاعد H₂S — رائحة عفن البيض',
          'NO':'تصاعد NO — يتأكسد في الهواء إلى NO₂ بني محمر'
        }[gasFromAnion]||'تصاعد غاز';
        const precip=(anion==='S2O3^2-')?{formula:'S',color:'#ffcc00',ar:'كبريت',arColor:'أصفر ذهبي'}:null;
        reactions.push({gas:gasFromAnion,precip,eq:eqText,note,identifiedFrom:srcId,thermic:'exo'});
      }
    }
  }

  for(const c of ions.cat){
    for(const a of ions.an){
      if(c.from===a.from)continue;
      const key=c.ion+'|'+a.ion;
      if(seen.has(key))continue;
      seen.add(key);
      const p=PRECIPITATE_TABLE[key];
      if(p){
        reactions.push({
          precip:{
            formula:p.formula,color:p.color,ar:p.ar,note:p.note,light:p.light,
            onHeat:p.onHeat,onStand:p.onStand,oxidize:p.oxidize,arColor:p.arColor
          },
          eq:c.ion+' + '+a.ion+' → '+p.formula+'(s)↓',
          note:p.note,identifiedFrom:c.from,thermic:'exo'
        });
      }
    }
  }

  const has=id=>vesselIds.includes(id);
  if(has('kmno4')&&has('na2c2o4')&&presentAcid){
    const key='kmno4+na2c2o4+acid';
    if(!seen.has(key)){
      seen.add(key);
      reactions.push({tint:'#f5f5f5',gas:'CO2',
        eq:'2MnO₄⁻(aq) + 16H⁺(aq) + 5C₂O₄²⁻(aq) → 2Mn²⁺(aq) + 10CO₂(g)↑ + 8H₂O(l)',
        note:'زوال اللون البنفسجي (تكوّن CO₂)',thermic:'exo'});
    }
  }
  if(has('i2')&&has('naoh')){
    const key='i2+naoh';
    if(!seen.has(key)){
      seen.add(key);
      reactions.push({tint:'#f5f5f5',
        eq:'3I₂(aq) + 6NaOH(aq) → 5NaI(aq) + NaIO₃(aq) + 3H₂O(l)',
        note:'زوال لون اليود في القلويات',thermic:'exo'});
    }
  }

  let identifiedIon=null,identifiedItem=null;
  for(const id of vesselIds){
    if(ANIONS_G1[id]||ANIONS_G2[id]||ANIONS_G3[id]){
      identifiedIon=findItem(id).ion;
      identifiedItem=findItem(id);
      break;
    }
    if(CATIONS[id]){
      identifiedIon=CATIONS[id].ion;
      identifiedItem=CATIONS[id];
      break;
    }
  }

  const precipitates=reactions.filter(r=>r.precip).map(r=>({
    formula:r.precip.formula,color:r.precip.color,ar:r.precip.ar||'',
    arColor:r.precip.arColor||colorName(r.precip.color)
  }));

  return {reactions,identifiedIon,identifiedItem,precipitates};
}

let actx=null,soundOn=true;

function A(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(actx.state==='suspended')actx.resume();
  return actx;
}
function noiseBuf(a,dur){
  const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  return b;
}
function playPour(){
  if(!soundOn)return;
  const a=A();if(!a)return;
  const t=a.currentTime,src=a.createBufferSource();
  src.buffer=noiseBuf(a,0.45);
  const f=a.createBiquadFilter();
  f.type='bandpass';f.frequency.setValueAtTime(600,t);
  f.frequency.exponentialRampToValueAtTime(1500,t+0.4);f.Q.value=1.4;
  const g=a.createGain();
  g.gain.setValueAtTime(0.001,t);
  g.gain.exponentialRampToValueAtTime(0.14,t+0.05);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.45);
  src.connect(f).connect(g).connect(a.destination);
  src.start(t);src.stop(t+0.5);
}
function playFizz(dur){
  dur=dur||1.2;
  if(!soundOn)return;
  const a=A();if(!a)return;
  const t=a.currentTime,src=a.createBufferSource();
  src.buffer=noiseBuf(a,dur);
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=3200;
  const g=a.createGain();
  g.gain.setValueAtTime(0.001,t);
  g.gain.exponentialRampToValueAtTime(0.1,t+0.12);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f).connect(g).connect(a.destination);
  src.start(t);src.stop(t+dur);
}
function playDing(){
  if(!soundOn)return;
  const a=A();if(!a)return;
  const t=a.currentTime;
  [880,1320].forEach((fr,i)=>{
    const o=a.createOscillator();o.type='sine';o.frequency.value=fr;
    const g=a.createGain();
    g.gain.setValueAtTime(0.0001,t+i*0.05);
    g.gain.exponentialRampToValueAtTime(0.09,t+i*0.05+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.05+0.4);
    o.connect(g).connect(a.destination);
    o.start(t+i*0.05);o.stop(t+i*0.05+0.45);
  });
}

function hexToRgb(h){
  h=h.replace('#','');
  if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16);
  return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}
function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function lerpColor(c1,c2,t){
  const a=hexToRgb(c1),b=hexToRgb(c2);
  return rgbToHex(lerp(a.r,b.r,t),lerp(a.g,b.g,t),lerp(a.b,b.b,t));
}

  const s=Math.min(aw/BASE_W,ah/BASE_H);

function mixColor(contents){
  let r=0,g=0,b=0,w=0,a=0;
  const all=allReagents();
  for(const c of contents){
    const R=all[c.id];
    if(!R||isPaper(c.id))continue;
    const rgb=hexToRgb(R.c);
    const wt=c.vol*(R.a+0.35);
    r+=rgb.r*wt;g+=rgb.g*wt;b+=rgb.b*wt;w+=wt;
    a=Math.max(a,R.a);
  }
  if(w===0)return{r:220,g:235,b:245,a:0};
  const fr=r/w,fg=g/w,fb=b/w;
  const brightness=(fr+fg+fb)/3;
  const saturation=Math.max(fr,fg,fb)-Math.min(fr,fg,fb);
  let finalAlpha=Math.min(1,a+0.35);
  if(saturation<22&&brightness>195)finalAlpha=Math.min(finalAlpha,0.24);
  if(saturation<12&&brightness>210)finalAlpha=Math.min(finalAlpha,0.16);
  return{r:Math.round(fr),g:Math.round(fg),b:Math.round(fb),a:finalAlpha};
}

function startReactions(v){
  const ids=v.contents.map(c=>c.id);
  const hasMystery=MYSTERY_COMBO.every(x=>ids.includes(x));
  if(hasMystery&&!mysteryShaking){
    startMysterySequence(v);
    return true;
  }
  const result=smartReact(ids);
  if(result.identifiedIon){
    v.discIon=result.identifiedIon;
    v.discPrecip=result.precipitates;
    renderIonDisplay();
  }
  if(result.reactions.length){
    v.reactionQueue=result.reactions.slice();
    v.reactionTimer=0;
    applyNextReaction(v);
    return true;
  }
  return false;
}

function applyNextReaction(v){
  if(!v.reactionQueue.length)return;
  const rxn=v.reactionQueue.shift();
  applyReaction(v,rxn);
  v.reactionTimer=0;
}

function applyReaction(v,rxn){
  if(rxn.precip){
    v.precip=Object.assign({},rxn.precip);
    v.precipTarget=1;
    if(v.precipAmt>0.4)v.precipAmt=0.2;
  }
  if(rxn.gas){
    v.activeGas={type:rxn.gas,life:25,viaTube:false};
    v.gasType=rxn.gas;
    if(state.running)playFizz(1.5);
    if(rxn.gas==='NO'){
      setTimeout(function(){
        if(v.activeGas&&v.activeGas.type==='NO')v.activeGas.type='NO2';
      },2500);
    }
  }
  if(rxn.tint){
    v.colorTarget=Object.assign({},hexToRgb(rxn.tint),{a:rxn.tint==='#f5f5f5'?0.22:1});
  }
  if(rxn.heat)v.temp=Math.min(98,v.temp+rxn.heat);
  if(rxn.eq)setVesselEquation(v,rxn.eq,rxn.note);
  if(rxn.precip)addLog('🧪 راسب '+rxn.precip.formula+' — لونه: '+(rxn.precip.arColor||colorName(rxn.precip.color)));
  if(rxn.gas)addLog('💨 غاز '+rxn.gas+' — '+(gasNote(rxn.gas)||''));
  if(rxn.tint&&rxn.tint!=='#f5f5f5')addLog('🎨 لون المحلول: '+colorName(rxn.tint));
  if(rxn.thermic){
    v.thermic=rxn.thermic;
    v.thermicT=8;
    if(rxn.thermic==='exo'){addLog('🔥 تفاعل طارد للحرارة');v.temp=Math.min(98,v.temp+4);}
    else if(rxn.thermic==='endo'){addLog('❄️ تفاعل ماص للحرارة');v.temp=Math.max(10,v.temp-4);}
  }
  playDing();
  if(rxn.precip&&rxn.precip.light&&!v.exposed){
    document.getElementById('lightBtn').classList.add('show');
    document.getElementById('lightBtn').onclick=function(){
      v.exposed=true;
      v.precip=Object.assign({},v.precip,{color:'#374151'});
      document.getElementById('lightBtn').classList.remove('show');
      addLog('☀️ '+v.precip.formula+' تعرّض للضوء فاسودّ');
      setVesselEquation(v,'2'+v.precip.formula+'(s) --ضوء--> 2Ag(s) + X₂(g)↑','تحلل ضوئي');
      playDing();
    };
  }
}

function gasNote(g){
  const map={
    CO2:'يعكّر ماء الجير الرائق',
    SO2:'رائحة نفاذة — يخضر ورقة K₂Cr₂O₇',
    H2S:'رائحة عفن البيض — يسوّد ورقة خلات الرصاص',
    HCl:'أبخرة بيضاء مع ساق NH₃',
    NO:'عديم اللون — يتأكسد إلى NO₂ بني محمر',
    NO2:'بني محمر — حمضي',
    NH3:'رائحة نفاذة — قاعدي',
    Br2:'أبخرة برتقالية حمراء',
    I2:'أبخرة بنفسجية',
    O2:'يدعم الاحتراق',
    Cl2:'أصفر مخضر — مؤكسد قوي'
  };
  return map[g]||'';
}

  el.classList.remove('empty');
  let html='<div class="ion-list">';

function vesselPath(c,v){
  const x=v.x,y=v.y,w=v.w,h=v.h;
  const r=v.type==='tube'?w/2:13;
  c.beginPath();
  c.moveTo(x,y);
  c.lineTo(x,y+h-r);
  c.quadraticCurveTo(x,y+h,x+r,y+h);
  c.lineTo(x+w-r,y+h);
  c.quadraticCurveTo(x+w,y+h,x+w,y+h-r);
  c.lineTo(x+w,y);
  c.closePath();
}

function drawBackdrop(t){

  for(let y=0;y<BENCH_TOP;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  rg.addColorStop(0,'rgba(140,230,255,.16)');
  rg.addColorStop(1,'rgba(140,230,255,0)');

function drawGasFill(v,t){
  if(v.gasAmount<=0)return;
  if(v.volume>2)return;
  const gasColor={
    CO2:'#e8f5ff',SO2:'#fff0a8',H2S:'#dadada',HCl:'#ffffff',
    NO:'#f5f5f5',NO2:'#d2691e',NH3:'#a5f3a5',Br2:'#ff8c00',I2:'#c466ff',O2:'#e0f4ff',Cl2:'#c4e8a5'
  }[v.gasType]||'#e8f5ff';
  const intensity=Math.min(1,v.gasAmount/100);
  if(intensity<0.01)return;
  const baseAlpha=0.55*intensity;
  ctx.save();
  vesselPath(ctx,v);
  ctx.clip();
  const fillH=(v.h-12)*intensity;
  const top=v.y+6+(v.h-12)-fillH;
  const g=ctx.createLinearGradient(v.x,top,v.x,v.y+v.h-6);
  g.addColorStop(0,hexA(gasColor,baseAlpha*0.55));
  g.addColorStop(.4,hexA(gasColor,baseAlpha*0.92));
  g.addColorStop(1,hexA(gasColor,baseAlpha*0.75));
  ctx.fillStyle=g;
  ctx.fillRect(v.x-3,top,v.w+6,fillH);
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<6;i++){
    const ph=(t*0.55+i*0.17)%1;
    const px=v.x+8+((i+0.5)/6)*(v.w-16)+Math.sin(t*1.3+i*2.1)*4;
    const py=top+ph*fillH;
    if(py<top||py>v.y+v.h-8)continue;
    const rr=6+Math.sin(t*1.8+i)*2.5;
    const ag=ctx.createRadialGradient(px,py,0,px,py,rr*2.4);
    ag.addColorStop(0,hexA(gasColor,baseAlpha*0.65));
    ag.addColorStop(1,hexA(gasColor,0));
    ctx.fillStyle=ag;
    ctx.beginPath();
    ctx.arc(px,py,rr*2.4,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.restore();
}

function drawLiquid(v,t){

  const top=v.y+v.h-level;
  const c=v.color;
  const g=ctx.createLinearGradient(v.x,top,v.x+v.w,v.y+v.h);
  g.addColorStop(0,'rgba('+c.r+','+c.g+','+c.b+','+Math.min(1,c.a*0.9)+')');
  g.addColorStop(.5,'rgba('+Math.round(c.r*.95)+','+Math.round(c.g*.97)+','+c.b+','+Math.min(1,c.a)+')');
  g.addColorStop(1,'rgba('+Math.round(c.r*.75)+','+Math.round(c.g*.82)+','+Math.round(c.b*.95)+','+Math.min(1,c.a)+')');
  ctx.fillStyle=g;
  ctx.fillRect(v.x-3,top,v.w+6,level+3);
  ctx.fillStyle='rgba(255,255,255,.45)';
  ctx.fillRect(v.x-3,top,v.w+6,2.5);

  if(v.precipAmt>0.02&&v.precip){
    const ph=v.precipAmt*Math.min(58,level*0.88);
    const pc=hexToRgb(v.precip.color);
    const isWhite=pc.r>230&&pc.g>230&&pc.b>230;
    if(isWhite){
      ctx.save();
      const lw=Math.min(1,v.precipAmt);
      const tl=ctx.createLinearGradient(v.x,top,v.x,top+level);
      tl.addColorStop(0,'rgba(250,252,255,'+(0.72*lw)+')');
      tl.addColorStop(.5,'rgba(242,248,255,'+(0.60*lw)+')');
      tl.addColorStop(1,'rgba(228,238,250,'+(0.55*lw)+')');
      ctx.fillStyle=tl;
      ctx.fillRect(v.x-3,top,v.w+6,level+3);
      ctx.restore();
    }
    ctx.beginPath();
    ctx.moveTo(v.x-3,v.y+v.h+3);
    for(let i=0;i<=24;i++){
      const px=v.x-3+(v.w+6)*i/24;
      const py=v.y+v.h-ph+Math.sin(i*0.8+t*1.6)*1.8+Math.sin(i*2.3)*1.1;
      ctx.lineTo(px,py);
    }
    ctx.lineTo(v.x+v.w+3,v.y+v.h+3);
    ctx.closePath();
    const pg=ctx.createLinearGradient(0,v.y+v.h-ph,0,v.y+v.h);
    if(isWhite){
      pg.addColorStop(0,'rgba(255,255,255,1)');
      pg.addColorStop(.5,'rgba(248,251,255,1)');
      pg.addColorStop(1,'rgba(228,238,250,1)');
    }else{
      pg.addColorStop(0,'rgba('+pc.r+','+pc.g+','+pc.b+',1)');
      pg.addColorStop(.5,'rgba('+pc.r+','+pc.g+','+pc.b+',1)');
      pg.addColorStop(1,'rgba('+Math.round(pc.r*.75)+','+Math.round(pc.g*.75)+','+Math.round(pc.b*.75)+',1)');
    }
    ctx.fillStyle=pg;
    ctx.fill();
    ctx.strokeStyle=isWhite?'rgba(190,210,230,.95)':'rgba('+Math.round(pc.r*.6)+','+Math.round(pc.g*.6)+','+Math.round(pc.b*.6)+',.9)';
    ctx.lineWidth=1.4;
    ctx.stroke();
    if(isWhite){
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      for(let i=0;i<7;i++){
        const px=v.x-3+(v.w+6)*((i+0.5)/7);
        const py=v.y+v.h-ph*0.5-Math.sin(t*1.4+i)*2;
        const rr=2.5+Math.sin(t*2+i*1.3)*1.2;
        const sg=ctx.createRadialGradient(px,py,0,px,py,rr*3);
        sg.addColorStop(0,'rgba(255,255,255,'+(0.55*v.precipAmt)+')');
        sg.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=sg;
        ctx.beginPath();
        ctx.arc(px,py,rr*3,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  for(const b of v.bubbles){
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+(b.a*0.8)+')';
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,'+(b.a*0.95)+')';
    ctx.lineWidth=1;
    ctx.stroke();
  }
  ctx.restore();
}

function drawVessel(v,t){
  ctx.save();
  if(v.shakeT>0){
    const intensity=(v.shakeT>1.5)?0.4:0.26;
    const a=Math.sin(v.shakeT*38)*intensity*v.shakeT;
    ctx.translate(v.cx,v.bottom);
    ctx.rotate(a);
    ctx.translate(-v.cx,-v.bottom);
  }
  if(Math.abs(v.angle)>0.001){
    ctx.translate(v.cx,v.bottom);
    ctx.rotate(v.angle);
    ctx.translate(-v.cx,-v.bottom);
  }
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.6)';
  ctx.shadowBlur=20;
  ctx.shadowOffsetY=8;
  ctx.fillStyle='rgba(255,255,255,.035)';
  vesselPath(ctx,v);
  ctx.fill();
  ctx.restore();

  drawGasFill(v,t);
  drawLiquid(v,t);

  ctx.save();
  vesselPath(ctx,v);
  const gg=ctx.createLinearGradient(v.x,0,v.x+v.w,0);
  gg.addColorStop(0,'rgba(255,255,255,.25)');
  gg.addColorStop(.18,'rgba(255,255,255,.04)');
  gg.addColorStop(.82,'rgba(255,255,255,.03)');
  gg.addColorStop(1,'rgba(255,255,255,.20)');
  ctx.fillStyle=gg;
  ctx.fill();
  ctx.strokeStyle='rgba(200,240,255,.75)';
  ctx.lineWidth=2.4;
  ctx.stroke();
  ctx.restore();

  ctx.save();
  vesselPath(ctx,v);
  ctx.clip();
  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.fillRect(v.x+8,v.y+14,5,v.h-44);
  ctx.restore();

  ctx.beginPath();
  ctx.ellipse(v.cx,v.y,v.w/2,5.5,0,0,Math.PI*2);
  ctx.strokeStyle='rgba(210,245,255,.85)';
  ctx.lineWidth=2.2;
  ctx.stroke();

  const hasTube=tubes.some(tb=>tb.from===v||tb.to===v);
  if(v.activeGas&&v.activeGas.life>0&&!hasTube&&state.running&&!v.hasStopper){
    const gasColor={
      CO2:'#f5f5f5',SO2:'#fff0a8',H2S:'#c8c8c8',HCl:'#ffffff',
      NO:'#f5f5f5',NO2:'#d2691e',NH3:'#a5f3a5',Br2:'#ff8c00',I2:'#c466ff',O2:'#e0f4ff',Cl2:'#c4e8a5'
    }[v.activeGas.type]||'#f5f5f5';
    const alpha=Math.min(0.6,v.activeGas.life/25*0.6);
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<5;i++){
      const ph=(t*0.6+i*0.22)%1;
      const px=v.cx+Math.sin(ph*5+i*1.9)*14;
      const py=v.y-10-ph*70;
      const rr=12+ph*30;
      const ag=ctx.createRadialGradient(px,py,0,px,py,rr);
      ag.addColorStop(0,hexA(gasColor,alpha*(1-ph)));
      ag.addColorStop(1,hexA(gasColor,0));
      ctx.fillStyle=ag;
      ctx.beginPath();
      ctx.arc(px,py,rr,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  if(v.temp>62&&v.volume>2&&v.activeGas&&v.activeGas.life>0){
    const inten=clamp((v.temp-62)/38,0,1);
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<6;i++){
      const ph=(t*0.9+i*0.37)%1;
      const px=v.cx+Math.sin(ph*6+i*2.1)*15;
      const py=v.y-6-ph*70;
      const rr=6+ph*22;
      const ag=ctx.createRadialGradient(px,py,0,px,py,rr);
      ag.addColorStop(0,'rgba(220,245,255,'+(0.16*inten*(1-ph))+')');
      ag.addColorStop(1,'rgba(220,245,255,0)');
      ctx.fillStyle=ag;
      ctx.beginPath();
      ctx.arc(px,py,rr,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  if(v.thermic&&v.thermicT>0){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const opacity=Math.min(1,v.thermicT/2)*0.4;
    const col=v.thermic==='exo'?'rgba(255,80,30,':'rgba(60,180,255,';
    const glow=ctx.createRadialGradient(v.cx,v.y+v.h*0.5,10,v.cx,v.y+v.h*0.5,Math.max(v.w,v.h)*0.9);
    glow.addColorStop(0,col+(opacity)+')');
    glow.addColorStop(1,col+'0)');
    ctx.fillStyle=glow;
    ctx.beginPath();
    ctx.arc(v.cx,v.y+v.h*0.5,Math.max(v.w,v.h)*0.9,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  if(state.gasTubeArmed&&state.gasTubeSource!==v&&state.gasTubeSource){
    ctx.save();
    ctx.strokeStyle='rgba(255,184,77,'+(0.6+0.4*Math.sin(t*6))+')';
    ctx.lineWidth=3;
    ctx.setLineDash([8,6]);
    ctx.lineDashOffset=-t*20;
    ctx.beginPath();
    ctx.arc(v.cx,v.y+v.h/2,Math.max(v.w,v.h)*0.65,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  if(state.gasTubeArmed&&state.gasTubeSource===v){
    ctx.save();
    ctx.strokeStyle='rgba(46,204,113,'+(0.75+0.25*Math.sin(t*6))+')';
    ctx.lineWidth=3.5;
    ctx.beginPath();
    ctx.arc(v.cx,v.y+v.h/2,Math.max(v.w,v.h)*0.68,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawVesselNumber(v,idx){
  const op=v.opening;
  const x=op.x;
  const y=op.y-22;
  const isExo=v.thermic==='exo'&&v.thermicT>0;
  const isEndo=v.thermic==='endo'&&v.thermicT>0;
  ctx.save();
  if(isExo||isEndo){
    ctx.beginPath();
    ctx.arc(x,y,17,0,Math.PI*2);
    ctx.strokeStyle=isExo?'rgba(255,90,40,.95)':'rgba(60,180,255,.95)';
    ctx.lineWidth=3;
    ctx.shadowColor=isExo?'#ff5a28':'#3cb4ff';
    ctx.shadowBlur=16;
    ctx.stroke();
    ctx.shadowBlur=0;
  }
  ctx.beginPath();
  ctx.arc(x,y,12,0,Math.PI*2);
  const g=ctx.createRadialGradient(x,y,2,x,y,12);
  g.addColorStop(0,'#a8f0ff');
  g.addColorStop(1,'#5fc8ee');
  ctx.fillStyle=g;
  ctx.shadowColor='#7fe3ff';
  ctx.shadowBlur=12;
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,.95)';
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.fillStyle='#051018';
  ctx.font='bold 13px Consolas,monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(String(idx),x,y+1);
  if(isExo||isEndo){
    ctx.beginPath();
    ctx.arc(x+14,y-14,9,0,Math.PI*2);
    ctx.fillStyle=isExo?'rgba(255,90,40,.9)':'rgba(60,180,255,.9)';
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.9)';
    ctx.lineWidth=1.4;
    ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 11px Tahoma';
    ctx.fillText(isExo?'🔥':'❄️',x+14,y-14);
  }
  if(v.gasAmount>0){
    const barX=x-16;
    const barY=y+18;
    const barW=32;
    const barH=4;
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(barX,barY,barW,barH,2);
    ctx.fillStyle='rgba(0,0,0,.55)';
    ctx.fill();
    const gasCol=v.gasType?({
      CO2:'#7fe3ff',SO2:'#fff0a8',H2S:'#c8c8c8',HCl:'#ffffff',
      NO:'#f5f5f5',NO2:'#d2691e',NH3:'#a5f3a5',Br2:'#ff8c00',I2:'#c466ff',O2:'#e0f4ff',Cl2:'#c4e8a5'
    }[v.gasType]||'#7fe3ff'):'#7fe3ff';
    ctx.beginPath();
    ctx.roundRect(barX,barY,barW*(v.gasAmount/100),barH,2);
    ctx.fillStyle=gasCol;
    ctx.shadowColor=gasCol;
    ctx.shadowBlur=8;
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawTubes(t){
  for(const tube of tubes){
    const a=tube.from,b=tube.to;
    if(!vessels.includes(a)||!vessels.includes(b))continue;
    const oa=a.opening,ob=b.opening;
    ctx.save();
    const cpx=(oa.x+ob.x)/2;
    const cpy=Math.min(oa.y,ob.y)-70;
    ctx.strokeStyle='rgba(0,0,0,.55)';
    ctx.lineWidth=11;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(oa.x,oa.y);
    ctx.quadraticCurveTo(cpx,cpy,ob.x,ob.y);
    ctx.stroke();
    ctx.strokeStyle='rgba(200,240,255,.85)';
    ctx.lineWidth=7;
    ctx.beginPath();
    ctx.moveTo(oa.x,oa.y);
    ctx.quadraticCurveTo(cpx,cpy,ob.x,ob.y);
    ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.5)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(oa.x,oa.y-2);
    ctx.quadraticCurveTo(cpx,cpy-2,ob.x,ob.y-2);
    ctx.stroke();
    [oa,ob].forEach(p=>{
      ctx.strokeStyle='rgba(255,184,77,.95)';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(p.x,p.y,6,0,Math.PI*2);
      ctx.stroke();
    });
    if(a.activeGas&&a.activeGas.life>0&&a.reactionStarted&&state.running){
      const gasColor={
        CO2:'#f5f5f5',SO2:'#fff0a8',H2S:'#c8c8c8',HCl:'#ffffff',
        NO:'#f5f5f5',NO2:'#d2691e',NH3:'#a5f3a5',Br2:'#ff8c00',I2:'#c466ff',O2:'#e0f4ff',Cl2:'#c4e8a5'
      }[a.activeGas.type]||'#f5f5f5';
      for(let i=0;i<10;i++){
        const ph=((t*0.5+i/10)%1);
        const px=(1-ph)*(1-ph)*oa.x+2*(1-ph)*ph*cpx+ph*ph*ob.x;
        const py=(1-ph)*(1-ph)*oa.y+2*(1-ph)*ph*cpy+ph*ph*ob.y;
        ctx.beginPath();
        ctx.arc(px,py,5,0,Math.PI*2);
        ctx.fillStyle=hexA(gasColor,0.95);
        ctx.fill();
        ctx.strokeStyle=hexA(gasColor,1);
        ctx.lineWidth=1.2;
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}

function drawPaperStrip(p,t){
  const base=PAPERS[p.paperId];
  if(!base)return;
  ctx.save();
  const bob=Math.sin(t*1.6+p.animT)*0.5;
  let scale=1;
  if(p.isMystery&&p.spawnScale!==undefined&&p.spawnScale<1){
    const elapsed=performance.now()-(p.spawnTime||0);
    p.spawnScale=Math.min(1,elapsed/600);
    scale=1+Math.sin(p.spawnScale*Math.PI)*0.5;
    scale*=p.spawnScale;
  }
  ctx.translate(p.x+p.w/2,p.y+p.h/2+bob);
  ctx.rotate(p.angle);
  if(scale!==1)ctx.scale(scale,scale);

  let drawColor=p.color;
  if(p.isMystery&&!p.burning){
    const hue=(t*60)%360;
    drawColor='hsl('+hue+',80%,60%)';
  }
  if(p.burning){
    drawColor=lerpColor(drawColor,'#1a1a1a',p.burnProgress);
  }
  ctx.save();
  ctx.shadowColor=p.isMystery?'rgba(168,85,247,.7)':'rgba(0,0,0,.55)';
  ctx.shadowBlur=p.isMystery?20:14;
  ctx.shadowOffsetY=6;
  ctx.beginPath();
  ctx.roundRect(-p.w/2,-p.h/2,p.w,p.h,5);
  const pg=ctx.createLinearGradient(0,-p.h/2,0,p.h/2);
  pg.addColorStop(0,drawColor);
  pg.addColorStop(1,lerpColor(drawColor,'#000000',0.22));
  ctx.fillStyle=pg;
  ctx.fill();
  ctx.restore();
  ctx.strokeStyle=p.isMystery?'rgba(168,85,247,.95)':'rgba(0,0,0,.4)';
  ctx.lineWidth=p.isMystery?2.5:1.3;
  ctx.beginPath();
  ctx.roundRect(-p.w/2,-p.h/2,p.w,p.h,5);
  ctx.stroke();

  if(p.isMystery&&!p.burning){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<5;i++){
      const ph=(t*1.5+i*0.25)%1;
      const px=Math.sin(ph*6+i*1.8)*p.w*0.35;
      const py=Math.cos(ph*6+i*1.8)*p.h*0.35;
      const rr=8+Math.sin(t*3+i)*3;
      const ag=ctx.createRadialGradient(px,py,0,px,py,rr*2);
      ag.addColorStop(0,'rgba(196,107,255,0.55)');
      ag.addColorStop(1,'rgba(196,107,255,0)');
      ctx.fillStyle=ag;
      ctx.beginPath();
      ctx.arc(px,py,rr*2,0,Math.PI*2);
      ctx.fill();
    }
    if(p.gasFlash>0){
      const intensity=p.gasFlash;
      const flashPulse=0.55+0.45*Math.abs(Math.sin(t*8));
      ctx.globalCompositeOperation='lighter';
      const halo=ctx.createRadialGradient(0,0,5,0,0,p.w*1.8);
      halo.addColorStop(0,'rgba(255,255,255,'+(0.9*intensity*flashPulse)+')');
      halo.addColorStop(0.35,'rgba(236,72,153,'+(0.7*intensity*flashPulse)+')');
      halo.addColorStop(0.7,'rgba(168,85,247,'+(0.45*intensity*flashPulse)+')');
      halo.addColorStop(1,'rgba(168,85,247,0)');
      ctx.fillStyle=halo;
      ctx.beginPath();
      ctx.arc(0,0,p.w*1.8,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='rgba(255,255,255,'+(0.55*intensity*flashPulse)+')';
      ctx.beginPath();
      ctx.roundRect(-p.w/2,-p.h/2,p.w,p.h,5);
      ctx.fill();
      for(let i=0;i<4;i++){
        const ph=(t*2+i*0.25)%1;
        const px=Math.sin(ph*8+i*2.1)*p.w*0.6;
        const py=Math.cos(ph*8+i*2.1)*p.h*0.6;
        const rr=5+Math.sin(t*4+i)*2;
        const sg=ctx.createRadialGradient(px,py,0,px,py,rr*2.5);
        sg.addColorStop(0,'rgba(255,255,255,'+(0.85*intensity)+')');
        sg.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=sg;
        ctx.beginPath();
        ctx.arc(px,py,rr*2.5,0,Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  if(p.burning){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<6;i++){
      const ph=(t*3+i*0.3)%1;
      const px=(Math.random()-0.5)*p.w;
      const py=p.h/2-ph*p.h;
      const rr=6+Math.random()*10;
      const ag=ctx.createRadialGradient(px,py,0,px,py,rr);
      ag.addColorStop(0,'rgba(255,220,100,'+(1-ph)*0.9+')');
      ag.addColorStop(.5,'rgba(255,120,30,'+(1-ph)*0.6+')');
      ag.addColorStop(1,'rgba(255,60,0,0)');
      ctx.fillStyle=ag;
      ctx.beginPath();
      ctx.arc(px,py,rr,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  if(p.reacted&&!p.burning&&!p.isMystery){
    ctx.save();
    ctx.strokeStyle='rgba(255,214,107,.95)';
    ctx.lineWidth=2.4;
    ctx.shadowColor='#ffd66b';
    ctx.shadowBlur=14;
    ctx.beginPath();
    ctx.roundRect(-p.w/2-3,-p.h/2-3,p.w+6,p.h+6,6);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawThermometer(){
  if(!state.showThermo)return;
  const x=W-95,top=165,bot=415;
  let maxT=25;
  for(const v of vessels)if(v.volume>0)maxT=Math.max(maxT,v.temp);
  const frac=clamp(maxT/120,0,1);
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x-9,top,18,bot-top,9);
  ctx.fillStyle='rgba(230,250,255,.14)';
  ctx.fill();
  ctx.strokeStyle='rgba(190,235,255,.55)';
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x,bot+14,14,0,Math.PI*2);
  ctx.fillStyle='rgba(230,250,255,.16)';
  ctx.fill();
  ctx.strokeStyle='rgba(190,235,255,.55)';
  ctx.stroke();
  const mh=frac*(bot-top-14);
  const mg=ctx.createLinearGradient(0,bot+14,0,top);
  mg.addColorStop(0,'#ff4d4d');
  mg.addColorStop(.5,'#ff7043');
  mg.addColorStop(1,'#ffca28');
  ctx.fillStyle=mg;
  ctx.beginPath();
  ctx.roundRect(x-5,bot-mh,10,mh+6,5);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x,bot+14,10,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#9fe9ff';
  ctx.font='bold 10px Tahoma';
  ctx.textAlign='center';
  ctx.fillText('°C',x,top-10);
  ctx.restore();
}

function drawWire(){
  if(!state.showBurner||!state.wire.active)return;
  const b=state.burner;
  const x=b.x,y=b.base-96-40;
  ctx.save();
  ctx.strokeStyle='#d8dee4';
  ctx.lineWidth=2.4;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x+95,y-70);
  ctx.quadraticCurveTo(x+50,y-58,x+2,y-6);
  ctx.stroke();
  ctx.fillStyle='#37474f';
  ctx.beginPath();
  ctx.roundRect(x+88,y-84,16,34,5);
  ctx.fill();
  const c=state.wire.loaded?(FLAME_TEST[state.wire.loaded]?FLAME_TEST[state.wire.loaded].color:'#ffffff'):'#e0e0e0';
  ctx.beginPath();
  ctx.arc(x+2,y-5,4.5,0,Math.PI*2);
  ctx.fillStyle=c;
  ctx.fill();
  ctx.shadowColor=c;
  ctx.shadowBlur=14;
  ctx.fill();
  ctx.restore();
}

function drawDroplets(dt){
  for(const d of droplets){
    if(d.dead)continue;
    d.vy+=620*dt;
    d.y+=d.vy*dt;
    if(d.y>=d.target){d.dead=true;continue;}
    ctx.beginPath();
    ctx.ellipse(d.x,d.y,d.r*0.85,d.r*1.5,0,0,Math.PI*2);
    ctx.fillStyle=hexA(d.color,d.alpha);
    ctx.fill();
  }
  droplets=droplets.filter(d=>!d.dead);
}

function drawPourDrips(dt){
  for(const d of pourDrips){
    if(d.dead)continue;
    d.vy+=700*dt;
    d.y+=d.vy*dt;
    d.x+=d.vx*dt;
    if(d.y>d.target){d.dead=true;continue;}
    ctx.beginPath();
    ctx.ellipse(d.x,d.y,d.r*0.85,d.r*1.5,0,0,Math.PI*2);
    ctx.fillStyle=d.color;
    ctx.fill();
  }
  pourDrips=pourDrips.filter(d=>!d.dead);
}

function drawSmokeClouds(dt){
  for(const s of smokeClouds){
    s.life-=dt;
    if(s.life<=0)continue;
    const alpha=s.life/s.maxLife;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const t=performance.now()/1000;
    for(let i=0;i<8;i++){
      const ph=(t*0.4+i*0.15)%1;
      const px=s.x+Math.sin(ph*4+i*1.5)*35;
      const py=s.y-ph*60;
      const rr=15+ph*40;
      const ag=ctx.createRadialGradient(px,py,0,px,py,rr);
      ag.addColorStop(0,'rgba(255,255,255,'+(alpha*0.5*(1-ph))+')');
      ag.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=ag;
      ctx.beginPath();
      ctx.arc(px,py,rr,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
  smokeClouds=smokeClouds.filter(s=>s.life>0);
}

function drawSparks(dt){
  for(const s of sparks){
    s.life-=dt;
    if(s.life<=0)continue;
    s.vy+=180*dt;
    s.x+=s.vx*dt;
    s.y+=s.vy*dt;
    const alpha=s.life/s.maxLife;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r*alpha,0,Math.PI*2);
    ctx.fillStyle=hexA(s.color,alpha);
    ctx.fill();
    ctx.restore();
  }
  sparks=sparks.filter(s=>s.life>0);
}

function updatePaperReaction(p,dt){
  if(p.dead)return;

  if(p.gasFlash>0&&!p.gasPassed){
    p.gasFlash=Math.max(0,p.gasFlash-dt*1.8);
  }

  if(p.burning){
    p.burnProgress=Math.min(1,p.burnProgress+dt*0.8);
    if(Math.random()<dt*15)spawnSparks(p.x+p.w/2,p.y+p.h/2,2);
    if(p.burnProgress>=1){
      p.burning=false;
      p.burnt=true;
      p.dead=true;
      if(p.isMystery&&p.gasPassed&&!p.easterShown){
        p.easterShown=true;
        showEasterEgg();
      }
    }
    return;
  }

  if(p.isMystery){
    let nearest=null,minDist=150;
    for(const v of vessels){
      if(!v.activeGas||v.activeGas.life<=0)continue;
      if(!state.running)continue;
      if(v.activeGas.type!=='CO2')continue;
      const dx=(p.x+p.w/2)-v.cx,dy=(p.y+p.h/2)-v.y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<minDist){minDist=d;nearest=v;}
    }
    if(nearest){
      p.gasPassed=true;
      p.gasFlash=1;
    }
    if(state.showBurner&&state.burnerOn){
      const b=state.burner;
      const dx=(p.x+p.w/2)-b.x;
      const dy=(p.y+p.h/2)-(b.base-78);
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<115){
        p.burning=true;
        p.burnProgress=0.05;
        playFizz(1.5);
        spawnSparks(p.x+p.w/2,p.y+p.h/2,15);
      }
    }
    return;
  }

  if(state.showBurner&&state.burnerOn){
    const b=state.burner;
    const dx=(p.x+p.w/2)-b.x;
    const dy=(p.y+p.h/2)-(b.base-78);
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<115){
      p.burning=true;
      p.burnProgress=0.05;
      addLog('🔥 الورقة اقتربت من اللهب — بدأت تحترق');
      setVesselEquation({id:'burn_'+p.paperId},
        'ورقة '+PAPERS[p.paperId].label+'(s) + O₂(g) --احتراق--> CO₂(g)↑ + H₂O(g)↑ + رماد',
        'احتراق كامل — اختفت الورقة');
      playFizz(1.5);
      spawnSparks(p.x+p.w/2,p.y+p.h/2,15);
    }
  }

  let nearest=null,minDist=130;
  for(const v of vessels){
    if(!v.activeGas||v.activeGas.life<=0)continue;
    if(!state.running)continue;
    const dx=(p.x+p.w/2)-v.cx,dy=(p.y+p.h/2)-v.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<minDist){minDist=d;nearest=v;}
  }
  if(!nearest){p.contactGas=null;return;}
  const gasType=nearest.activeGas.type;
  const test=(GAS_TESTS[gasType]||{})[p.paperId];
  if(!test)return;
  p.contactGas=gasType;
  if(p.reacted){if(p.color!==test.color)p.color=test.color;return;}
  p.progress=Math.min(1,p.progress+dt/2.4);
  p.color=lerpColor(PAPERS[p.paperId].color,test.color,p.progress);
  if(p.progress>=1){
    p.reacted=true;
    addLog('📜 '+PAPERS[p.paperId].ar+' + '+gasType+': '+test.note);
    setVesselEquation(nearest,test.eq||(gasType+' + '+PAPERS[p.paperId].label+' → تغيّر لوني'),test.note);
    playDing();
    playFizz(0.8);
  }
}

function formatSingleLine(line){
  let s=line;
  s=s.replace(/--Δ-->/g,'\u2401')
     .replace(/--ضوء-->/g,'\u2402')
     .replace(/--احتراق-->/g,'\u2403')
     .replace(/--اهتزاز-->/g,'\u2407')
     .replace(/-->/g,'\u2404')
     .replace(/→/g,'\u2405')
     .replace(/⇌/g,'\u2406');
  let html=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  html=html.replace(/\u2401/g,'<span class="heat">--Δ--&gt;</span>')
           .replace(/\u2402/g,'<span class="light">--ضوء--&gt;</span>')
           .replace(/\u2403/g,'<span class="burn">--احتراق--&gt;</span>')
           .replace(/\u2407/g,'<span class="eq">--اهتزاز--&gt;</span>')
           .replace(/\u2404/g,'<span class="ar">--&gt;</span>')
           .replace(/\u2405/g,'<span class="ar">→</span>')
           .replace(/\u2406/g,'<span class="eq">⇌</span>');
  html=html.replace(/\((s|l|g|aq)\)/g,'<sub>($1)</sub>');
  html=html.replace(/↑/g,'<span class="g">↑</span>');
  html=html.replace(/↓/g,'<span class="p">↓</span>');
  return html;
}

function formatEquationHTML(eq){
  return String(eq).split('\n').map(formatSingleLine).join('<br>');
}

function renderEquations(){
  const eqbar=document.getElementById('eqbar');
  const oldContent=eqbar.querySelectorAll('.eq-line,.eq-list');
  oldContent.forEach(l=>l.remove());
  const noteEl=document.getElementById('eqnote');
  const active=vessels.map(function(v,i){return{v:v,i:i};})
                     .filter(function(x){return x.v.contents.length>0;});
  if(!active.length){
    const div=document.createElement('div');
    div.className='eq-line';
    if(state.equation){
      div.innerHTML=formatEquationHTML(state.equation.eq);
      noteEl.textContent=state.equation.note||'';
    }else{
      div.textContent='— المعادلة ستظهر هنا —';
      noteEl.textContent='';
    }
    eqbar.insertBefore(div,noteEl);
    return;
  }
  if(active.length===1){
    const x=active[0];
    const div=document.createElement('div');
    div.className='eq-line';
    if(x.v.lastEq){
      div.innerHTML=formatEquationHTML(x.v.lastEq);
    }else{
      div.textContent='— بانتظار التفاعل —';
    }
    eqbar.insertBefore(div,noteEl);
    noteEl.textContent=x.v.lastNote||'';
    return;
  }
  const wrap=document.createElement('div');
  wrap.className='eq-list';
  for(const x of active){
    const idx=x.i+1;
    const item=document.createElement('div');
    item.className='eq-list-item';
    const num=document.createElement('span');
    num.className='eq-num';
    num.textContent=idx;
    const eq=document.createElement('span');
    eq.className='eq-line-inline';
    if(x.v.lastEq){
      eq.innerHTML=formatEquationHTML(x.v.lastEq);
    }else{
      eq.textContent='— بانتظار التفاعل —';
      eq.style.color='#6a8fa3';
      eq.style.fontStyle='italic';
    }
    item.appendChild(num);
    item.appendChild(eq);
    wrap.appendChild(item);
  }
  eqbar.insertBefore(wrap,noteEl);
  noteEl.textContent='';
}

function setVesselEquation(v,eq,note){
  state.equation={eq,note:note||''};
  if(v&&vessels.indexOf(v)>=0){
    v.lastEq=eq;
    v.lastNote=note||'';
  }
  addToHistory(eq,note);
  renderEquations();
}

function addToHistory(eq,note){
  reactionHistory.unshift({eq,note:note||''});
  if(reactionHistory.length>30)reactionHistory.pop();
  renderHistory();
}

function renderHistory(){
  const el=document.getElementById('historyList');
  if(!el)return;
  if(!reactionHistory.length){
    el.innerHTML='<div class="history-empty">لا توجد تفاعلات بعد</div>';
    return;
  }
  let html='';
  for(const r of reactionHistory){
    html+='<div class="history-item">';
    html+='<div class="hi-eq">'+formatEquationHTML(r.eq)+'</div>';
    if(r.note)html+='<div class="hi-note">'+r.note+'</div>';
    html+='</div>';
  }
  el.innerHTML=html;
}

let last=performance.now();

function loop(now){
  try{
    const dt=Math.min(0.05,(now-last)/1000);
    last=now;
    state.time=now/1000;
    const t=state.time;
    update(dt,t);
    ctx.clearRect(0,0,W,H);
    drawBackdrop(t);
    drawBench();
    drawBurner(t);
    drawTubes(t);
    for(const v of vessels)drawVessel(v,t);
    for(const v of vessels)drawStopper(v,t);
    if(vessels.length>=2){
      for(let i=0;i<vessels.length;i++){
        drawVesselNumber(vessels[i],i+1);
      }
    }
    for(const p of papers)drawPaperStrip(p,t);
    drawThermometer();
    drawWire();
    drawDroplets(dt);
    drawPourDrips(dt);
    drawSmokeClouds(dt);
    drawSparks(dt);
  }catch(err){
    showError('خطأ: '+err.message);
  }
  requestAnimationFrame(loop);
}

function update(dt,t){
  const b=state.burner;

  if(mysteryShaking){
    const elapsed=performance.now()-mysteryShaking.startTime;
    const v=mysteryShaking.vessel;
    if(!vessels.includes(v)){
      mysteryShaking=null;
    }else if(elapsed>=mysteryShaking.duration){
      vanishVesselAndSpawnPaper(v);
      mysteryShaking=null;
    }
  }

  for(const tube of tubes){
    const a=tube.from,bv=tube.to;
    if(!vessels.includes(a)||!vessels.includes(bv))continue;
    if(!a.reactionStarted)continue;
    if(a.activeGas&&a.activeGas.life>0){
      if(bv.gasAmount<100){
        bv.gasAmount=Math.min(100,bv.gasAmount+dt*18);
      }
      bv.gasType=a.activeGas.type;
      bv.activeGas={type:a.activeGas.type,life:25,viaTube:true};
      if(bv.contents.length===0){
        bv.hasStopper=false;
      }else{
        const targetIds=bv.contents.map(c=>c.id);
        for(const id of targetIds){
          const key=a.activeGas.type+'|'+id;
          const reaction=GAS_LIQUID_REACTIONS[key];
          if(reaction&&!bv.reactedGases[key]){
            bv.reactedGases[key]=true;
            applyGasReaction(bv,reaction,a.activeGas.type);
          }
        }
      }
    }
  }

  for(const v of vessels){
    v.dispVol=lerp(v.dispVol,v.volume,Math.min(1,dt*6));
    if(v.colorTarget){
      const s=Math.min(1,dt*1.2);
      v.color.r=lerp(v.color.r,v.colorTarget.r,s);
      v.color.g=lerp(v.color.g,v.colorTarget.g,s);
      v.color.b=lerp(v.color.b,v.colorTarget.b,s);
      v.color.a=lerp(v.color.a,v.colorTarget.a,s);
      const dr=Math.abs(v.color.r-v.colorTarget.r);
      const dg=Math.abs(v.color.g-v.colorTarget.g);
      const db=Math.abs(v.color.b-v.colorTarget.b);
      const da=Math.abs(v.color.a-v.colorTarget.a)*255;
      if(dr+dg+db+da<4)v.colorTarget=null;
    }
    v.precipAmt=lerp(v.precipAmt,v.precipTarget,Math.min(1,dt*1.4));
    if(v.shakeT>0){
      const speed=(v.shakeT>1.5)?0.3:0.65;
      v.shakeT=Math.max(0,v.shakeT-dt/speed);
    }
    if(v.thermicT>0)v.thermicT=Math.max(0,v.thermicT-dt);

    const hasIncoming=tubes.some(function(tb){return tb.to===v&&tb.from.activeGas&&tb.from.activeGas.life>0&&tb.from.reactionStarted;});

    if(v.gasAmount>0&&!v.hasStopper&&!hasIncoming){
      v.gasAmount=Math.max(0,v.gasAmount-dt*18);
      if(v.gasAmount<=0&&!v.gasConsumed){
        v.gasConsumed=true;
        v.activeGas=null;
        v.gasType=null;
      }
    }

    if(v.activeGas){
      if(v.hasStopper){
        v.activeGas.life=25;
      }else if(v.activeGas.viaTube){
        if(hasIncoming&&state.running){
          v.activeGas.life=25;
        }else{
          v.activeGas.life-=dt*3;
          if(v.activeGas.life<=0)v.activeGas=null;
        }
      }else if(v.gasAmount>0){
        v.activeGas.life=25;
      }else if(!state.running){
        v.activeGas.life-=dt*0.4;
        if(v.activeGas.life<=0)v.activeGas=null;
      }else if(v.contents.length>0&&!v.gasConsumed){
        v.activeGas.life=Math.max(v.activeGas.life,20);
      }else{
        v.activeGas.life-=dt*2.5;
        if(v.activeGas.life<=0)v.activeGas=null;
      }
    }

    if(v.activeGas&&v.activeGas.type==='CO2'&&v.precip&&v.precip.formula==='CaCO₃'&&state.running&&v.gasAmount>0){
      v.dissolveTimer+=dt;
      if(v.dissolveTimer>12&&v.co2DissolveStage===0){
        v.co2DissolveStage=1;
        addLog('🔵 بدأ الراسب الأبيض يذوب تدريجيًا — تكوّن Ca(HCO₃)₂ الذائب');
        setVesselEquation(v,'CaCO₃(s) + H₂O(l) + CO₂(g) → Ca(HCO₃)₂(aq)','الراسب الأبيض يذوب بمرور CO₂ الطويل');
        playDing();
      }
      if(v.co2DissolveStage===1){
        v.precipTarget=Math.max(0,1-(v.dissolveTimer-12)/18);
      }
      if(v.dissolveTimer>30&&v.co2DissolveStage===1){
        v.precip=null;
        v.precipTarget=0;
        v.colorTarget={r:200,g:232,b:250,a:0.20};
        v.co2DissolveStage=2;
        addLog('🔵 زال تعكر ماء الجير تمامًا — Ca(HCO₃)₂ ذائب في الماء');
        setVesselEquation(v,'CaCO₃(s) + H₂O(l) + CO₂(g) → Ca(HCO₃)₂(aq)','زال التعكر تمامًا — الراسب اختفى');
        playDing();
      }
    }
  }

  if(!state.running){
    updateThermoPanel();
    return;
  }

  for(const v of vessels){
    const nearFlame=state.burnerOn&&state.showBurner&&
      v.cx>b.x-70&&v.cx<b.x+70&&
      v.bottom>b.base-140&&v.bottom<b.base+40;
    v.heating=nearFlame;
    if(nearFlame){
      v.temp=Math.min(105,v.temp+dt*38);
    }else if(v.thermicT>0&&v.thermic==='exo'){
      v.temp=Math.min(120,v.temp+dt*6);
    }else if(v.thermicT>0&&v.thermic==='endo'){
      v.temp=Math.max(5,v.temp-dt*5);
    }else{
      v.temp=lerp(v.temp,25,Math.min(1,dt*0.3));
    }

    if(v.contents.length&&nearFlame&&v.temp>70){
      let hr=null;
      for(const c of v.contents){
        if(HEAT_REACTIONS[c.id]){hr=HEAT_REACTIONS[c.id];break;}
      }
      if(hr){
        v.naturalHeatTimer+=dt;
        if(v.naturalHeatTimer>1.2){
          if(hr.gas){v.activeGas={type:hr.gas,life:25,viaTube:false};v.gasType=hr.gas;}
          if(hr.tint)v.colorTarget=Object.assign({},hexToRgb(hr.tint),{a:0.35});
          if(hr.thermic){
            v.thermic=hr.thermic;
            v.thermicT=8;
          }
          if(!v.heatReactionDone){
            setVesselEquation(v,hr.eq,hr.note);
            addLog('🔥 تسخين: '+hr.note);
            if(hr.thermic==='endo')addLog('❄️ تفاعل ماص للحرارة (حراري)');
            v.heatReactionDone=true;
          }
        }
      }
    }else if(!nearFlame){
      v.naturalHeatTimer=0;
      v.heatReactionDone=false;
    }

    if(!v.reactionStarted)continue;

    if(v.reactionQueue.length){
      v.reactionTimer+=dt;
      if(v.reactionTimer>3.5)applyNextReaction(v);
    }

    if(v.precip){
      if(v.precip.onHeat&&!v.onHeatTriggered&&v.temp>55){
        v.heatTimer+=dt;
        if(v.heatTimer>2){
          v.onHeatTriggered=true;
          const newColor=v.precip.onHeat.color;
          const newArColor=v.precip.onHeat.arColor||colorName(newColor);
          v.precip=Object.assign({},v.precip,{color:newColor,arColor:newArColor});
          addLog('🔥 تسخين: '+v.precip.formula+' — اللون أصبح '+newArColor);
          setVesselEquation(v,v.precip.onHeat.eq||(v.precip.formula+' --Δ--> ناتج'),v.precip.onHeat.note);
          playDing();
          playFizz(0.6);
          if(v.precip.onHeat.eq&&v.precip.onHeat.eq.indexOf('CO₂')>=0){v.activeGas={type:'CO2',life:25,viaTube:false};v.gasType='CO2';}
        }
      }else if(!v.precip.onHeat){
        v.heatTimer=0;
      }
      if(v.precip.onStand&&!v.onStandTriggered){
        v.standTimer+=dt;
        if(v.standTimer>8){
          v.onStandTriggered=true;
          const newColor=v.precip.onStand.color;
          const newArColor=v.precip.onStand.arColor||colorName(newColor);
          v.precip=Object.assign({},v.precip,{color:newColor,arColor:newArColor});
          addLog('⏳ بالوقوف: '+v.precip.formula+' — اللون أصبح '+newArColor);
          setVesselEquation(v,v.precip.formula+' → ... (تحول تلقائي)',v.precip.onStand.note);
          playDing();
        }
      }
      if(v.precip.oxidize&&!v.oxidized){
        v.oxidizeTimer+=dt;
        if(v.oxidizeTimer>3){
          v.oxidized=true;
          v.precip=Object.assign({},v.precip,{color:'#a83232',arColor:'بني محمر'});
          addLog('🌫️ الأكسدة بالهواء: اللون أصبح بني محمر');
        }
      }
    }

    if(v.temp>88&&v.volume>2&&Math.random()<dt*14){
      v.bubbles.push({
        x:v.x+8+Math.random()*(v.w-16),
        y:v.y+v.h-8,
        r:1.6+Math.random()*2.6,
        vy:-(35+Math.random()*45),
        a:0.9
      });
    }
    if(v.activeGas&&v.activeGas.life>0&&v.volume>1&&Math.random()<dt*20){
      v.bubbles.push({
        x:v.x+8+Math.random()*(v.w-16),
        y:v.y+v.h-10-Math.random()*12,
        r:1.5+Math.random()*3,
        vy:-(45+Math.random()*60),
        a:1
      });
    }

    const lvlTop=v.y+v.h-Math.min(v.h-8,(v.dispVol/v.cap)*(v.h-10));
    for(const bb of v.bubbles){
      bb.y+=bb.vy*dt;
      bb.x+=Math.sin(t*5+bb.y*0.08)*0.4;
      if(bb.y<lvlTop+3)bb.a-=dt*2.2;
    }
    v.bubbles=v.bubbles.filter(bb=>bb.a>0.05&&bb.y>v.y-4);
  }

  for(const p of papers)updatePaperReaction(p,dt);
  for(let i=papers.length-1;i>=0;i--){
    if(papers[i].dead)papers.splice(i,1);
  }

  updateThermoPanel();
}

function updateThermoPanel(){
  if(!state.showThermo)return;
  let maxT=25;
  for(const v of vessels)if(v.volume>0)maxT=Math.max(maxT,v.temp);
  const tv=document.getElementById('tempVal');
  if(tv)tv.textContent=Math.round(maxT);
  const fill=document.getElementById('tempFill');
  if(fill){
    fill.style.width=clamp(maxT/120*100,4,100)+'%';
    fill.style.background=maxT>80?'linear-gradient(90deg,#ff7043,#ff1744)'
      :maxT>45?'linear-gradient(90deg,#ffb300,#ff7043)'
      :'linear-gradient(90deg,#2196f3,#4dd0e1)';
  }
  const trendEl=document.getElementById('tempTrend');
  if(!trendEl)return;
  const trends=[];
  vessels.forEach(function(v,i){
    if(v.thermic&&v.thermicT>0){
      trends.push({idx:i+1,type:v.thermic});
    }
  });
  if(!trends.length){
    trendEl.innerHTML='<div class="empty">لا يوجد تفاعل حراري حالي</div>';
    return;
  }
  let html='';
  for(const tr of trends){
    if(tr.type==='exo'){
      html+='<div class="tag exo"><span class="ico">🔥</span><span class="lbl">تفاعل طارد</span><span class="num">أنبوب '+tr.idx+'</span></div>';
    }else{
      html+='<div class="tag endo"><span class="ico">❄️</span><span class="lbl">تفاعل ماص</span><span class="num">أنبوب '+tr.idx+'</span></div>';
    }
  }
  trendEl.innerHTML=html;
}

function applyGasReaction(vessel,reaction,gasType){
  if(reaction.precip){
    vessel.precip={
      formula:reaction.precip.formula,
      color:reaction.precip.color,
      ar:reaction.precip.ar,
      note:reaction.note,
      progressive:reaction.progressive,
      arColor:reaction.precip.arColor
    };
    vessel.precipTarget=1;
    vessel.precipAmt=Math.max(vessel.precipAmt,0.15);
    vessel.co2DissolveStage=0;
    vessel.dissolveTimer=0;
    if(reaction.progressive){
      vessel.colorTarget={r:242,g:246,b:252,a:0.52};
    }
  }
  if(reaction.tint){
    vessel.colorTarget=Object.assign({},hexToRgb(reaction.tint),{a:reaction.tint==='#f5f5f5'?0.22:1});
  }
  if(reaction.smoke){
    smokeClouds.push({x:vessel.cx,y:vessel.y-20,life:6,maxLife:6});
  }
  if(reaction.precip)addLog('🧪 راسب '+reaction.precip.formula+' — لونه: '+(reaction.precip.arColor||colorName(reaction.precip.color)));
  if(reaction.tint&&reaction.tint!=='#f5f5f5')addLog('🎨 لون المحلول: '+colorName(reaction.tint));
  if(reaction.thermic){
    vessel.thermic=reaction.thermic;
    vessel.thermicT=8;
    if(reaction.thermic==='exo')addLog('🔥 تفاعل طارد للحرارة');
    else if(reaction.thermic==='endo')addLog('❄️ تفاعل ماص للحرارة');
  }
  setVesselEquation(vessel,reaction.eq,reaction.note);
  playDing();
  playFizz(1.2);
}

function hitTestVessel(p){
  for(let i=vessels.length-1;i>=0;i--){
    const v=vessels[i];
    let lx=p.x,ly=p.y;
    if(Math.abs(v.angle)>0.001){
      const c=Math.cos(-v.angle),s=Math.sin(-v.angle);
      const dx=p.x-v.cx,dy=p.y-v.bottom;
      lx=v.cx+dx*c-dy*s;
      ly=v.bottom+dx*s+dy*c;
    }
    if(lx>=v.x-14&&lx<=v.x+v.w+14&&ly>=v.y-14&&ly<=v.y+v.h+6){
      return{vessel:v,localX:lx,localY:ly};
    }
  }
  return null;
}
function hitTestPaper(p){
  for(let i=papers.length-1;i>=0;i--){
    const pp=papers[i];
    if(p.x>=pp.x-8&&p.x<=pp.x+pp.w+8&&p.y>=pp.y-8&&p.y<=pp.y+pp.h+8)return pp;
  }
  return null;
}
function hitTestBurner(p){
  if(!state.showBurner)return false;
  const b=state.burner;
  return p.x>b.x-50&&p.x<b.x+50&&p.y>b.base-120&&p.y<b.base+20;
}
function hitTestTube(p){
  for(let i=tubes.length-1;i>=0;i--){
    const tube=tubes[i];
    const a=tube.from,b=tube.to;
    if(!vessels.includes(a)||!vessels.includes(b))continue;
    const oa=a.opening,ob=b.opening;
    const cpx=(oa.x+ob.x)/2;
    const cpy=Math.min(oa.y,ob.y)-70;
    for(let t=0;t<=1.001;t+=0.08){
      const px=(1-t)*(1-t)*oa.x+2*(1-t)*t*cpx+t*t*ob.x;
      const py=(1-t)*(1-t)*oa.y+2*(1-t)*t*cpy+t*t*ob.y;
      const dx=p.x-px,dy=p.y-py;
      if(dx*dx+dy*dy<225)return{tube,index:i};
    }
  }
  return null;
}

let dragItem=null;
const POUR_AMOUNT=12;
const MAX_SUBSTANCES=4;

function onShelfPointerDown(e,id,kind){
  if(state.wire.active&&kind==='bottle'){

function beginDragFromShelf(clientX,clientY,id,kind){

  dragItem.canvasY=c.y;
  buildDragGhost(dragItem);
  updateGhostPosition(dragItem);

function buildDragGhost(d){

    const R=findItem(d.id);

  }

}

function updateGhostPosition(d){
  const gw=dragGhost.offsetWidth||(d.kind==='bottle'?56:60);
  const gh=dragGhost.offsetHeight||(d.kind==='bottle'?106:76);
  const left=d.clientX-gw/2;
  const top=d.clientY+6;
  let rot=0;
  if(d.hover&&d.kind==='bottle'){
    const r=cvs.getBoundingClientRect();
    const hsx=r.left+(d.hover.cx/W)*r.width;
    const diff=hsx-d.clientX;
    rot=clamp(diff*0.5,-70,70);
  }
  dragGhost.style.transform='translate('+left+'px,'+top+'px) rotate('+rot+'deg)';
}

function onDragMove(e){
  if(!dragItem)return;
  dragItem.clientX=e.clientX;
  dragItem.clientY=e.clientY;
  const c=toCanvas(e.clientX,e.clientY);
  dragItem.canvasX=c.x;
  dragItem.canvasY=c.y;
  let hover=null;
  for(let i=vessels.length-1;i>=0;i--){
    const v=vessels[i];
    const dx=c.x-v.cx,dy=c.y-(v.y+v.h/2);
    if(Math.abs(dx)<v.w/2+55&&Math.abs(dy)<v.h/2+70){hover=v;break;}
  }
  dragItem.hover=hover;
  if(hover&&dragItem.kind==='bottle'&&!dragItem.hasPoured){
    pourFromDrag(dragItem,hover);
    dragItem.hasPoured=true;
    setTimeout(function(){
      if(dragItem&&dragItem.hasPoured){
        onDragUp({clientX:dragItem.clientX,clientY:dragItem.clientY});
      }
    },100);
    return;
  }
  updateGhostPosition(dragItem);
}

function pourFromDrag(d,v){
  if(v.volume>=v.cap-1)return;
  if(v.reactionStarted){
    showError('⚠️ التفاعل بدأ — اضغط "تفريغ" ثم أعد ملء الوعاء');
    return;
  }
  const existing=v.contents.find(c=>c.id===d.id);
  if(!existing&&v.contents.length>=MAX_SUBSTANCES){
    showError('الحد الأقصى '+MAX_SUBSTANCES+' مواد لكل وعاء قبل بدء التفاعل');
    return;
  }
  const amount=POUR_AMOUNT;
  if(existing)existing.vol+=amount;
  else v.contents.push({id:d.id,vol:amount});
  v.volume=Math.min(v.cap,v.volume+amount);
  v.mixed=false;
  if(!v.colorTarget)v.color=mixColor(v.contents);
  v.precipAmt=0;
  v.precipTarget=0;
  v.reactionQueue=[];
  v.co2DissolveStage=0;
  v.dissolveTimer=0;
  v.reactedGases={};
  v.heatReactionDone=false;
  v.naturalHeatTimer=0;
  v.discIon=null;
  v.discPrecip=null;
  v.lastEq=null;
  v.lastNote=null;
  v.gasConsumed=false;
  const hadGas=v.gasAmount>0&&v.hasStopper;
  const gasTypeSnapshot=v.gasType;
  if(v.hasStopper){
    v.hasStopper=false;
    v.gasConsumed=false;
    v.thermicT=8;
  }
  spawnDroplets(v,d.id);
  playPour();
  const c=v.color;
  for(let i=0;i<5;i++){
    pourDrips.push({
      x:v.cx+(Math.random()-0.5)*10,
      y:v.y-20-Math.random()*10,
      vx:(Math.random()-0.5)*15,
      vy:60+Math.random()*40,
      r:1.5+Math.random()*1.8,
      color:'rgb('+c.r+','+c.g+','+c.b+')',
      target:v.y+10,
      dead:false
    });
  }
  if(hadGas&&gasTypeSnapshot&&v.contents.length>=1){
    v.reactionStarted=true;
    let reactedSomething=false;
    for(const cont of v.contents){
      const key=gasTypeSnapshot+'|'+cont.id;
      const reaction=GAS_LIQUID_REACTIONS[key];
      if(reaction&&!v.reactedGases[key]){
        v.reactedGases[key]=true;
        applyGasReaction(v,reaction,gasTypeSnapshot);
        reactedSomething=true;
        break;
      }
    }
    if(reactedSomething)addLog('⚗️ تفاعل الغاز المخزّن مع المادة المضافة');
  }
  if(state.running&&v.contents.length>=2&&!v.reactionStarted){
    v.shakeT=0.6;
    v.mixed=true;
    v.reactionStarted=true;
    startReactions(v);
  }
  renderIonDisplay();
  renderEquations();
}

function onDragUp(e){
  window.removeEventListener('pointermove',onDragMove);
  window.removeEventListener('pointerup',onDragUp);
  window.removeEventListener('pointercancel',onDragUp);
  if(!dragItem)return;
  dragGhost.style.display='none';
  const c=toCanvas(e.clientX,e.clientY);
  if(dragItem.kind==='paper'){
    let hover=null;
    for(let i=vessels.length-1;i>=0;i--){
      const v=vessels[i];
      if(c.x>v.x-30&&c.x<v.x+v.w+30&&c.y>v.y-40&&c.y<v.y+v.h+30){hover=v;break;}
    }
    if(hover)testPaperDirect(hover,dragItem.id);
    else if(c.y>60&&c.y<BENCH_TOP-4&&c.x>8&&c.x<W-8){
      const maxY=BENCH_TOP-24;
      papers.push(new PaperStrip(dragItem.id,c.x,clamp(c.y,60,maxY)));
    }
  }
  dragItem=null;
}

function testPaperDirect(v,paperId){
  if(!v.activeGas||v.activeGas.life<=0)return;
  if(!state.running)return;
  const gasType=v.activeGas.type;
  const test=(GAS_TESTS[gasType]||{})[paperId];
  if(!test)return;
  const pp=new PaperStrip(paperId,v.cx+(Math.random()-0.5)*40,clamp(v.y+90,60,BENCH_TOP-24));
  pp.reacted=true;
  pp.color=test.color;
  pp.progress=1;
  papers.push(pp);
  addLog('📜 '+PAPERS[paperId].ar+' + '+gasType+': '+test.note);
  setVesselEquation(v,test.eq||(gasType+' + '+PAPERS[paperId].label+' → تغيّر لوني'),test.note);
  playDing();
  playFizz(0.8);
}

let canvasDrag=null;
let paperClickTimes={};
let vesselClickTimes={};
let tubeClickTimes={};

cvs.addEventListener('pointerdown',function(e){
  A();
  const p=toCanvas(e.clientX,e.clientY);

  if(state.gasTubeArmed){
    const vh=hitTestVessel(p);
    if(vh){
      const v=vh.vessel;
      if(!state.gasTubeSource){
        state.gasTubeSource=v;
        playDing();
      }else if(state.gasTubeSource!==v){
        tubes.push({from:state.gasTubeSource,to:v});
        playDing();
        state.gasTubeArmed=false;
        state.gasTubeSource=null;
        document.querySelector('.tool-btn[data-action="gas-tube"]').classList.remove('armed');
      }
    }
    return;
  }

  const tubeHit=hitTestTube(p);
  if(tubeHit){
    const key='tube_'+tubeHit.index+'_'+tubeHit.tube.from.id+'_'+tubeHit.tube.to.id;
    const now=Date.now();
    if(tubeClickTimes[key]&&now-tubeClickTimes[key]<450){
      const removed=tubes.splice(tubeHit.index,1)[0];
      delete tubeClickTimes[key];
      if(removed){
        const target=removed.to;
        if(target&&target.gasAmount>0&&target.contents.length===0){
          target.hasStopper=true;
          target.activeGas={type:target.gasType,life:25,viaTube:false};
          showError('🔗 أُزيل الأنبوب — السدادة مُركّبة على الغاز المُخزَّن');
        }else if(target&&target.activeGas&&target.activeGas.viaTube){
          target.activeGas.viaTube=false;
          showError('🔗 أُزيل الأنبوب — توقف تدفق الغاز، التفاعل يستمر بالغاز المخزّن');
        }else{
          showError('🔗 أُزيل أنبوب التوصيل');
        }
      }
      playDing();
      return;
    }
    tubeClickTimes[key]=now;
    return;
  }

  if(hitTestBurner(p)){
    state.burnerOn=!state.burnerOn;
    playDing();
    return;
  }

  const paperHit=hitTestPaper(p);
  if(paperHit){
    const idx=papers.indexOf(paperHit);
    const key='paper_'+idx;
    const now=Date.now();
    if(paperClickTimes[key]&&now-paperClickTimes[key]<450){
      if(idx>=0)papers.splice(idx,1);
      delete paperClickTimes[key];
      playDing();
      showError('🗑️ حُذفت الورقة');
      return;
    }
    paperClickTimes[key]=now;
    canvasDrag={mode:'move',obj:paperHit,objType:'paper',ox:p.x-paperHit.x,oy:p.y-paperHit.y,moved:false};
    cvs.setPointerCapture(e.pointerId);
    return;
  }

  const vh=hitTestVessel(p);
  if(vh){
    const v=vh.vessel;
    const key='vessel_'+v.id;
    const now=Date.now();
    if(vesselClickTimes[key]&&now-vesselClickTimes[key]<450){
      const idx=vessels.indexOf(v);
      if(idx>=0)vessels.splice(idx,1);
      for(let i=tubes.length-1;i>=0;i--){
        if(tubes[i].from===v||tubes[i].to===v)tubes.splice(i,1);
      }
      delete vesselClickTimes[key];
      renderIonDisplay();
      renderEquations();
      playDing();
      showError('🗑️ حُذف الوعاء رقم '+(idx+1));
      return;
    }
    vesselClickTimes[key]=now;
    const topZone=v.y+v.h*0.35;
    const mode=vh.localY<topZone?'tilt':'move';
    canvasDrag={mode,obj:v,objType:'vessel',ox:0,oy:0,moved:false};
    if(mode==='move'){
      canvasDrag.ox=vh.localX-v.x;
      canvasDrag.oy=vh.localY-v.y;
    }
    cvs.setPointerCapture(e.pointerId);
    return;
  }
});

    for(const v of vessels)if(v.type==='beaker')count++;

    vessels.push(new Vessel({
      id:'beaker_'+Date.now(),

      y:305,
      w:116,
      h:127,
      cap:140
    }));
    playDing();
    renderIonDisplay();
    renderEquations();
  }
  else if(action==='add-burner'){
    state.showBurner=!state.showBurner;
    if(!state.showBurner){state.burnerOn=false;state.wire.active=false;}
    btn.classList.toggle('on',state.showBurner);
    const flameBtn=document.querySelector('.tool-btn[data-action="flame-test"]');
    if(flameBtn){
      flameBtn.disabled=!state.showBurner;

        flameBtn.classList.remove('on');

        state.wire.loaded=null;

  else if(action==='add-thermo'){
    state.showThermo=!state.showThermo;
    btn.classList.toggle('on',state.showThermo);
    document.getElementById('thermoCard').style.display=state.showThermo?'block':'none';
  }
  else if(action==='flame-test'){
    if(!state.showBurner)return;
    state.wire.active=!state.wire.active;
    if(!state.wire.active){
      state.wire.loaded=null;
      state.wire.color=null;
      state.burnerOn=false;
    }else{
      state.burnerOn=true;
      state.wire.loaded=null;
      state.wire.color=null;
    }
    btn.classList.toggle('on',state.wire.active);
  }
  else if(action==='gas-tube'){
    state.gasTubeArmed=!state.gasTubeArmed;
    state.gasTubeSource=null;
    btn.classList.toggle('armed',state.gasTubeArmed);
    playDing();
  }
  else if(action==='react-toggle'){
    if(state.running){
      state.running=false;
    }else{
      let anyUnstarted=false;
      for(const v of vessels){
        if(v.volume>0&&v.contents.length>=2&&!v.reactionStarted){anyUnstarted=true;break;}
      }
      if(anyUnstarted)state.equation=null;
      state.running=true;
      for(const v of vessels){
        if(v.volume>0&&v.contents.length>=2&&!v.reactionStarted){
          v.shakeT=0.6;
          v.mixed=true;
          v.reactionStarted=true;
          startReactions(v);
        }
      }
    }
    updateReactBtn();
    playDing();
  }
  else if(action==='straight'){
    for(const v of vessels)v.angle=0;
    playDing();
  }
  else if(action==='reset-reaction'){
    for(const v of vessels){
      resetVesselReaction(v);
    }
    state.running=false;
    state.equation=null;
    updateReactBtn();
    renderEquations();
    renderIonDisplay();
    showError('🔄 أُعيد ضبط حالة التفاعل — يمكنك إضافة مواد جديدة (الحد الأقصى 4)');
    playDing();
  }
  else if(action==='clean'){
    for(const v of vessels){
      v.contents=[];
      v.volume=0;
      v.dispVol=0;
      v.temp=25;
      v.color={r:220,g:235,b:245,a:0};
      v.colorTarget=null;
      v.precip=null;
      v.precipAmt=0;
      v.precipTarget=0;
      v.bubbles=[];
      v.mixed=true;
      v.activeGas=null;
      v.angle=0;
      v.heatReacted=false;
      v.smokeStarted=false;
      v.dissolveTimer=0;
      v.exposed=false;
      v.heatTimer=0;
      v.standTimer=0;
      v.onHeatTriggered=false;
      v.onStandTriggered=false;
      v.oxidizeTimer=0;
      v.oxidized=false;
      v.reactionStarted=false;
      v.reactedGases={};
      v.co2DissolveStage=0;
      v.reactionQueue=[];
      v.reactionTimer=0;
      v.heatReactionDone=false;
      v.naturalHeatTimer=0;
      v.discIon=null;
      v.discPrecip=null;
      v.lastEq=null;
      v.lastNote=null;
      v.gasAmount=0;
      v.gasType=null;
      v.hasStopper=false;
      v.thermic=null;
      v.thermicT=0;
      v.gasConsumed=false;
    }
    papers.length=0;
    state.equation=null;
    state.running=false;
    renderEquations();
    renderIonDisplay();
    droplets=[];
    pourDrips=[];
    smokeClouds=[];
    sparks=[];
    tubes.length=0;
    const ionEl=document.getElementById('ionDisplay');
    ionEl.classList.add('empty');
    ionEl.textContent='— لم يُكتشف بعد —';
    document.getElementById('lightBtn').classList.remove('show');
    updateReactBtn();
    playDing();
  }
  else if(action==='clear-all'){
    vessels.length=0;
    papers.length=0;
    mysteryComboActivated=false;
    easterEggTriggered=false;
    mysteryShaking=null;
    const eggOv=document.getElementById('easterEggOverlay');
    if(eggOv)eggOv.classList.remove('show');
    tubes.length=0;
    droplets=[];
    pourDrips=[];
    smokeClouds=[];
    sparks=[];
    state.wire.active=false;
    state.wire.loaded=null;
    state.wire.color=null;
    state.burnerOn=false;
    state.showBurner=false;
    state.showThermo=false;
    state.gasTubeArmed=false;
    state.gasTubeSource=null;
    state.running=false;
    state.equation=null;
    reactionHistory.length=0;
    renderEquations();
    renderIonDisplay();
    renderHistory();
    logEl.innerHTML='';
    document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('on','armed'));
    const soundBtn=document.querySelector('.tool-btn[data-action="sound"]');
    if(soundBtn&&soundOn)soundBtn.classList.add('on');
    const flameBtn=document.querySelector('.tool-btn[data-action="flame-test"]');
    if(flameBtn)flameBtn.disabled=true;
    document.getElementById('thermoCard').style.display='none';
    document.getElementById('lightBtn').classList.remove('show');
    const ionEl=document.getElementById('ionDisplay');
    ionEl.classList.add('empty');
    ionEl.textContent='— لم يُكتشف بعد —';
    updateReactBtn();
    playDing();
  }
  else if(action==='sound'){
    soundOn=!soundOn;
    btn.classList.toggle('on',soundOn);
    const ic=btn.querySelector('.ico');
    if(ic)ic.textContent=soundOn?'🔔':'🔕';
    if(soundOn)playDing();
  }
}

function loadWire(id){
  const ft=FLAME_TEST[id];
  if(!ft){playDing();return;}
  state.wire.loaded=id;
  state.wire.color=ft.color;
  state.burnerOn=true;
  playDing();
  playFizz(0.7);
  setVesselEquation(
    vessels[0]||{id:'flame'},
    'العيّنة: '+(findItem(id).label||findItem(id).ion)+'  →  '+ft.ion,
    ft.note
  );
}

const logEl=document.getElementById('log');

function addLog(msg){
  const d=document.createElement('div');
  d.textContent=msg;
  logEl.prepend(d);
  while(logEl.children.length>20)logEl.lastChild.remove();
}
function showError(msg){
  const box=document.getElementById('errorBox');
  box.textContent=msg;
  box.classList.add('show');
  setTimeout(function(){box.classList.remove('show');},4000);
}

async function boot(){
  resize();
  renderEquations();
  renderIonDisplay();
  renderHistory();
  updateReactBtn();
  await new Promise(function(r){requestAnimationFrame(r);});
  resize();
  requestAnimationFrame(loop);
  document.getElementById('app').classList.add('show');
  requestAnimationFrame(updateArrows);
}

if(typeof ResizeObserver!=='undefined'){
  const ro=new ResizeObserver(function(){resize();updateArrows();});
  ro.observe(document.getElementById('canvasWrap'));
}else{
  window.addEventListener('resize',function(){setTimeout(resize,100);setTimeout(updateArrows,100);});
}


</script>
</body>
</html>
